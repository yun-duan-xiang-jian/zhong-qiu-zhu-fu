<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>中秋 · 伪3D粒子祝福</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }
  body {
    overflow: hidden;
    background: radial-gradient(ellipse at center, #12122a 0%, #05050f 100%);
    font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
    height: 100vh;
    user-select: none;
  }
  canvas {
    display: block;
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
  }
  .moon {
    position: fixed;
    top: 10%;
    right: 10%;
    width: 130px;
    height: 130px;
    border-radius: 50%;
    background-color: #fff7d6;
    box-shadow:
      0 0 40px 10px rgba(255, 224, 140, 0.35),
      0 0 80px 30px rgba(255, 200, 90, 0.18),
      inset -18px -10px 30px rgba(180, 140, 70, 0.25);
    pointer-events: none;
    z-index: 2;
    overflow: hidden;
    animation: moonGlow 4s ease-in-out infinite;
  }
  @keyframes moonGlow {
    0%, 100% {
      box-shadow:
        0 0 40px 10px rgba(255, 224, 140, 0.35),
        0 0 80px 30px rgba(255, 200, 90, 0.18),
        inset -18px -10px 30px rgba(180, 140, 70, 0.25);
    }
    50% {
      box-shadow:
        0 0 55px 16px rgba(255, 224, 140, 0.45),
        0 0 110px 40px rgba(255, 200, 90, 0.25),
        inset -18px -10px 30px rgba(180, 140, 70, 0.25);
    }
  }
  .moon::before {
    content: "";
    position: absolute;
    top: 18%;
    left: 22%;
    width: 18px;
    height: 18px;
    border-radius: 50%;
    background: rgba(210, 170, 110, 0.35);
  }
  .moon::after {
    content: "";
    position: absolute;
    top: 55%;
    left: 45%;
    width: 28px;
    height: 22px;
    border-radius: 50%;
    background: rgba(210, 170, 110, 0.28);
  }
  .moon .spot {
    position: absolute;
    border-radius: 50%;
    background: rgba(190, 150, 90, 0.3);
  }
  .moon .spot1 {
    top: 38%;
    left: 15%;
    width: 10px;
    height: 10px;
  }
  .moon .spot2 {
    top: 70%;
    left: 28%;
    width: 14px;
    height: 12px;
  }
  .moon .spot3 {
    top: 25%;
    left: 58%;
    width: 8px;
    height: 8px;
  }
  .top-tip {
    position: fixed;
    top: 12px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 3;
    color: #fff8cc;
    opacity: 0.7;
    font-size: 13px;
    letter-spacing: 2px;
    pointer-events: none;
    white-space: nowrap;
  }
  .music-btn {
    position: fixed;
    left: 50%;
    bottom: 40px;
    transform: translateX(-50%);
    z-index: 3;
    padding: 12px 28px;
    border: 1px solid rgba(255, 221, 119, 0.5);
    border-radius: 999px;
    background: rgba(10, 10, 30, 0.45);
    color: #fff4c2;
    font-size: 14px;
    letter-spacing: 4px;
    cursor: pointer;
    backdrop-filter: blur(6px);
    transition: all 0.3s ease;
  }
  .music-btn:hover {
    background: rgba(255, 221, 119, 0.18);
    border-color: rgba(255, 221, 119, 0.9);
    box-shadow: 0 0 18px rgba(255, 221, 119, 0.35);
  }
  .reset-btn {
    position: fixed;
    right: 24px;
    bottom: 40px;
    z-index: 3;
    padding: 12px 20px;
    border: 1px solid rgba(255, 221, 119, 0.5);
    border-radius: 999px;
    background: rgba(10, 10, 30, 0.45);
    color: #fff4c2;
    font-size: 14px;
    letter-spacing: 2px;
    cursor: pointer;
    backdrop-filter: blur(6px);
    transition: all 0.3s ease;
  }
  .reset-btn:hover {
    background: rgba(255, 221, 119, 0.18);
    border-color: rgba(255, 221, 119, 0.9);
    box-shadow: 0 0 18px rgba(255, 221, 119, 0.35);
  }
  audio {
    display: none;
  }
</style>
</head>
<body>
  <div class="moon">
    <span class="spot spot1"></span>
    <span class="spot spot2"></span>
    <span class="spot spot3"></span>
  </div>

  <div class="top-tip">🖱️拖拽旋转｜滚轮缩放｜点击放烟花</div>

  <canvas id="particleCanvas"></canvas>

  <button class="music-btn" id="musicBtn">点击开启音乐</button>
  <button class="reset-btn" id="resetBtn">重置视角</button>

  <audio id="bgMusic" src="music.mp3" loop>

<script>
const canvas = document.getElementById("particleCanvas");
const ctx = canvas.getContext("2d");
const musicBtn = document.getElementById("musicBtn");
const resetBtn = document.getElementById("resetBtn");
const bgMusic = document.getElementById("bgMusic");
let musicOn = false;

let rotX = 0;
let rotY = 0;
let scale = 1;
let isDrag = false;
let lastX = 0;
let lastY = 0;
const fov = 500;

resetBtn.addEventListener("click", () => {
  rotX = 0;
  rotY = 0;
  scale = 1;
});

canvas.addEventListener('mousedown', e => {
  isDrag = true;
  lastX = e.clientX;
  lastY = e.clientY;
});
window.addEventListener('mousemove', e => {
  if (!isDrag) return;
  const dx = e.clientX - lastX;
  const dy = e.clientY - lastY;
  rotY -= dx * 0.005;
  rotX += dy * 0.005;
  lastX = e.clientX;
  lastY = e.clientY;
});
window.addEventListener('mouseup', () => isDrag = false);

canvas.addEventListener('wheel', e => {
  e.preventDefault();
  scale += e.deltaY * -0.0008;
  scale = Math.max(0.4, Math.min(2.2, scale));
}, { passive: false });

function project(x, y, z) {
  let y1 = y * Math.cos(rotX) - z * Math.sin(rotX);
  let z1 = y * Math.sin(rotX) + z * Math.cos(rotX);
  let x1 = x * Math.cos(rotY) + z1 * Math.sin(rotY);
  let z2 = -x * Math.sin(rotY) + z1 * Math.cos(rotY);

  const perspective = fov / (fov + z2);
  const sx = canvas.width / 2 + x1 * perspective * scale;
  const sy = canvas.height / 2 + y1 * perspective * scale;
  const s = perspective * scale;
  return { x: sx, y: sy, scale: s, z: z2 };
}

function screenToWorld(screenX, screenY, worldZ = 70) {
  const ndcX = (screenX - canvas.width / 2) / scale;
  const ndcY = (screenY - canvas.height / 2) / scale;
  const z2 = worldZ;
  const perspective = fov / (fov + z2);
  let x1 = ndcX / perspective;
  let y1 = ndcY / perspective;
  let z1 = z2;

  let x = x1 * Math.cos(-rotY) - z1 * Math.sin(-rotY);
  let z_ = x1 * Math.sin(-rotY) + z1 * Math.cos(-rotY);
  let y = y1 * Math.cos(-rotX) - z_ * Math.sin(-rotX);
  let zOut = y1 * Math.sin(-rotX) + z_ * Math.cos(-rotX);
  return { x: x, y: y, z: zOut };
}

let bgParticles = [];

musicBtn.addEventListener("click", (e) => {
  e.stopPropagation();
  if (bgMusic.paused) {
    bgMusic.volume = 0.6;
    bgMusic.play().then(() => {
      musicOn = true;
      musicBtn.innerText = "音乐播放中 · 点击暂停";
    }).catch(err => {
      musicBtn.innerText = "音乐加载失败，请检查文件名";
      console.error(err);
    });
  } else {
    bgMusic.pause();
    musicOn = false;
    musicBtn.innerText = "点击开启音乐";
  }
});

function resize() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
  initTextParticles();
  initBgParticles();
}

function initBgParticles() {
  bgParticles = [];
  const count = 350;
  for (let i = 0; i < count; i++) {
    bgParticles.push(new BgParticle());
  }
}

window.addEventListener("resize", resize);

const texts = ["中秋安康", "花好月圆"];
let textIndex = 0;
let textChangeTimer = 0;
const textChangeInterval = 240;
let textParticles = [];

class TextParticle {
  constructor(targetX, targetY, targetZ) {
    this.x = (Math.random() - 0.5) * 800;
    this.y = (Math.random() - 0.5) * 600;
    this.z = (Math.random() - 0.5) * 400;

    this.targetX = targetX;
    this.targetY = targetY;
    this.targetZ = targetZ;

    this.size = Math.random() * 3 + 2;
    this.baseAlpha = 0.75 + Math.random() * 0.25;
    this.color = Math.random() > 0.4 ? "#ffe28a" : "#fff6c2";

    this.speed = 0.05 + Math.random() * 0.03;
    this.offsetAngle = Math.random() * Math.PI * 2;
    this.offsetSpeed = 0.015 + Math.random() * 0.02;
    this.rotation = Math.random() * Math.PI * 2;
    this.rotationSpeed = (Math.random() - 0.5) * 0.04;
  }

  update() {
    this.x += (this.targetX - this.x) * this.speed;
    this.y += (this.targetY - this.y) * this.speed;
    this.z += (this.targetZ - this.z) * this.speed;

    this.offsetAngle += this.offsetSpeed;
    const breathX = Math.sin(this.offsetAngle) * 1.8;
    const breathY = Math.cos(this.offsetAngle * 0.6) * 1.4;
    this.rotation += this.rotationSpeed;
    const twinkle = 0.7 + Math.sin(this.offsetAngle * 2.4) * 0.3;

    const p = project(this.x + breathX, this.y + breathY, this.z);
    if (p.z > -450) {
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(this.rotation);
      const drawSize = this.size * p.scale;

      ctx.fillStyle = "rgba(255, 226, 138, 0.35)";
      ctx.globalAlpha = this.baseAlpha * twinkle * 0.5 * Math.min(1, p.scale * 1.2);
      ctx.shadowBlur = 18 * p.scale;
      ctx.shadowColor = "rgba(255, 210, 110, 0.9)";
      ctx.fillRect(-drawSize, -drawSize, drawSize * 2, drawSize * 2);

      ctx.fillStyle = this.color;
      ctx.globalAlpha = this.baseAlpha * twinkle * Math.min(1, p.scale * 1.2);
      ctx.shadowBlur = 10 * p.scale;
      ctx.shadowColor = "rgba(255, 246, 194, 0.8)";
      ctx.fillRect(-drawSize / 2, -drawSize / 2, drawSize, drawSize);

      ctx.restore();
    }
    ctx.globalAlpha = 1;
    ctx.shadowBlur = 0;
  }
}

class BgParticle {
  constructor() {
    this.reset();
  }
  reset() {
    this.x = (Math.random() - 0.5) * 900;
    this.y = (Math.random() - 0.5) * 700;
    this.z = (Math.random() - 0.5) * 500;
    this.r = Math.random() * 1.2 + 0.3;
    this.vx = (Math.random() - 0.5) * 0.22;
    this.vy = (Math.random() - 0.5) * 0.22;
    this.vz = (Math.random() - 0.5) * 0.12;
    this.a = Math.random() * 0.35 + 0.18;
    this.color = Math.random() > 0.5 ? "180, 210, 255" : "255, 248, 204";
  }

  update() {
    this.x += this.vx;
    this.y += this.vy;
    this.z += this.vz;

    if (Math.abs(this.x) > 450 || Math.abs(this.y) > 350 || Math.abs(this.z) > 280) this.reset();

    const p = project(this.x, this.y, this.z);
    if (p.z > -450) {
      ctx.beginPath();
      ctx.arc(p.x, p.y, this.r * p.scale, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(${this.color}, ${this.a * Math.min(1, p.scale)})`;
      ctx.shadowBlur = 6 * p.scale;
      ctx.shadowColor = `rgba(${this.color}, 0.5)`;
      ctx.fill();
    }
    ctx.shadowBlur = 0;
  }
}

class FireworkParticle {
  constructor(x, y, z) {
    this.x = x;
    this.y = y;
    this.z = z;
    const angle = Math.random() * Math.PI * 2;
    const speed = Math.random() * 4 + 2;
    this.vx = Math.cos(angle) * speed;
    this.vy = Math.sin(angle) * speed;
    this.vz = (Math.random() - 0.5) * speed * 0.6;
    this.r = Math.random() * 2 + 1;
    this.alpha = 1;
    this.decay = 0.008 + Math.random() * 0.006;
    this.color = Math.random() > 0.5 ? "255,220,120" : "255,255,255";
  }
  update() {
    this.vy += 0.08;
    this.x += this.vx;
    this.y += this.vy;
    this.z += this.vz;
    this.alpha -= this.decay;
  }
  draw() {
    const p = project(this.x, this.y, this.z);
    if (p.z > -450 && this.alpha > 0) {
      ctx.beginPath();
      ctx.arc(p.x, p.y, this.r * p.scale, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(${this.color}, ${this.alpha * Math.min(1, p.scale)})`;
      ctx.shadowBlur = 10 * p.scale;
      ctx.shadowColor = `rgba(${this.color},0.6)`;
      ctx.fill();
    }
    ctx.shadowBlur = 0;
  }
}
let fireworkParticles = [];

canvas.addEventListener("click", (e) => {
  e.stopPropagation();
  const worldPos = screenToWorld(e.clientX, e.clientY, 70);
  for (let i = 0; i < 80; i++) {
    fireworkParticles.push(new FireworkParticle(worldPos.x, worldPos.y, worldPos.z));
  }
})

function getTextPoints(text) {
  const offscreen = document.createElement("canvas");
  const octx = offscreen.getContext("2d");
  const fontSize = Math.min(110, window.innerWidth / 5);
  octx.font = `600 ${fontSize}px "PingFang SC", "Microsoft YaHei", sans-serif`;
  octx.textAlign = "center";
  octx.textBaseline = "middle";
  const width = Math.ceil(octx.measureText(text).width) + 120;
  const height = fontSize + 60;
  offscreen.width = width;
  offscreen.height = height;
  octx.font = `600 ${fontSize}px "PingFang SC", "Microsoft YaHei", sans-serif`;
  octx.textAlign = "center";
  octx.textBaseline = "middle";
  octx.fillStyle = "#ffffff";
  octx.fillText(text, width / 2, height / 2);
  const imageData = octx.getImageData(0, 0, width, height);
  const data = imageData.data;
  const points = [];
  const gap = 4;
  for (let y = 0; y < height; y += gap) {
    for (let x = 0; x < width; x += gap) {
      const index = (y * width + x) * 4;
      if (data[index + 3] > 128) {
        points.push({
          x: (x - width / 2) * 0.75,
          y: (y - height / 2) * 0.75,
          z: 0
        });
      }
    }
  }
  return points;
}

function initTextParticles() {
  const text = texts[textIndex];
  const points = getTextPoints(text);
  textParticles = [];
  for (let i = 0; i < points.length; i++) {
    const p = points[i];
    textParticles.push(new TextParticle(p.x, p.y, p.z));
  }
}

function changeTextTarget() {
  const text = texts[textIndex];
  const points = getTextPoints(text);
  for (let i = 0; i < textParticles.length; i++) {
    const p = points[i % points.length];
    textParticles[i].targetX = p.x;
    textParticles[i].targetY = p.y;
    textParticles[i].targetZ = p.z;
  }
}

function animate() {
  ctx.fillStyle = "rgba(5, 5, 15, 0.22)";
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  for (const p of bgParticles) p.update();

  for (let i = fireworkParticles.length - 1; i >= 0; i--) {
    const fp = fireworkParticles[i];
    fp.update();
    fp.draw();
    if (fp.alpha <= 0) {
      fireworkParticles.splice(i, 1);
    }
  }

  for (const p of textParticles) p.update();

  textChangeTimer++;
  if (textChangeTimer >= textChangeInterval) {
    textChangeTimer = 0;
    textIndex = (textIndex + 1) % texts.length;
    changeTextTarget();
  }

  requestAnimationFrame(animate);
}

resize();
animate();
</script>
</body>
</html>
