<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>中秋 · 3D月华粒子祝福</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
  }

  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background:
      radial-gradient(ellipse at 72% 18%, rgba(42,48,82,0.38) 0%, rgba(14,16,36,0.10) 36%, transparent 58%),
      radial-gradient(ellipse at 22% 82%, rgba(36,28,58,0.28) 0%, transparent 55%),
      linear-gradient(180deg, #090b1b 0%, #060713 52%, #03040b 100%);
    font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
    user-select: none;
    touch-action: none;
  }

  canvas {
    display: block;
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
  }

  .top-tip {
    position: fixed;
    top: 12px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 3;
    color: #fff8cc;
    opacity: 0.7;
    font-size: 13px;
    letter-spacing: 2px;
    pointer-events: none;
    white-space: nowrap;
  }

  .music-btn {
    position: fixed;
    left: 50%;
    bottom: 44px;
    transform: translateX(-50%);
    z-index: 3;
    padding: 0 28px;
    min-width: 180px;
    max-width: 42vw;
    height: 46px;
    line-height: 44px;
    border: 1px solid rgba(255, 221, 119, 0.5);
    border-radius: 999px;
    background: rgba(10, 10, 30, 0.45);
    color: #fff4c2;
    font-size: 14px;
    letter-spacing: 4px;
    text-align: center;
    white-space: nowrap;
    cursor: pointer;
    backdrop-filter: blur(6px);
    transition: all 0.3s ease;
  }

  .music-btn:hover {
    background: rgba(255, 221, 119, 0.18);
    border-color: rgba(255, 221, 119, 0.9);
    box-shadow: 0 0 18px rgba(255, 221, 119, 0.35);
  }

  .reset-btn {
    position: fixed;
    right: 16px;
    bottom: 44px;
    z-index: 3;
    padding: 0 20px;
    min-width: 110px;
    max-width: 30vw;
    height: 46px;
    line-height: 44px;
    border: 1px solid rgba(255, 221, 119, 0.5);
    border-radius: 999px;
    background: rgba(10, 10, 30, 0.45);
    color: #fff4c2;
    font-size: 14px;
    letter-spacing: 2px;
    text-align: center;
    white-space: nowrap;
    cursor: pointer;
    backdrop-filter: blur(6px);
    transition: all 0.3s ease;
  }

  .reset-btn:hover {
    background: rgba(255, 221, 119, 0.18);
    border-color: rgba(255, 221, 119, 0.9);
    box-shadow: 0 0 18px rgba(255, 221, 119, 0.35);
  }

  audio {
    display: none;
  }

  body::after {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 2;
    box-shadow: inset 0 0 160px rgba(0,0,0,0.52);
  }

  .top-tip, .music-btn, .reset-btn {
    transition: opacity .55s ease, transform .35s ease, background .3s ease, border-color .3s ease, box-shadow .3s ease;
  }

  body.ui-idle .top-tip { opacity: 0.18; }
  body.ui-idle .music-btn, body.ui-idle .reset-btn { opacity: 0.42; }

  @media (max-width: 480px) {
    .top-tip {
      font-size: 11px;
    }
    .music-btn {
      min-width: 150px;
      max-width: 46vw;
      height: 42px;
      line-height: 40px;
      font-size: 12px;
      letter-spacing: 3px;
      padding: 0 18px;
    }
    .reset-btn {
      min-width: 90px;
      max-width: 28vw;
      height: 42px;
      line-height: 40px;
      font-size: 12px;
      padding: 0 14px;
    }
  }
</style>
</head>
<body>
  <div class="top-tip">单指拖拽旋转｜双指捏合缩放｜点击月亮召唤嫦娥</div>

  <canvas id="particleCanvas"></canvas>

  <button class="music-btn" id="musicBtn">点击开启音乐</button>
  <button class="reset-btn" id="resetBtn">重置视角</button>

  <audio id="bgMusic" src="music.mp3" loop>

<script>
const canvas = document.getElementById("particleCanvas");
const ctx = canvas.getContext("2d");
const musicBtn = document.getElementById("musicBtn");
const resetBtn = document.getElementById("resetBtn");
const bgMusic = document.getElementById("bgMusic");
const MOBILE_ASSET = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);

// ========== 高清嫦娥贴图 ==========
// 将 changee_transparent.png 与本 HTML 放在同一目录。页面会使用它替代原先的简笔几何嫦娥。
const changEImage = new Image();
changEImage.decoding = "async";
changEImage.src = MOBILE_ASSET ? "changee_mobile.png" : "changee_transparent.png";
let changEImageReady = false;
changEImage.onload = () => { changEImageReady = true; };
changEImage.onerror = () => { console.warn("changee_transparent.png 加载失败"); };

// ========== 3D月亮贴图 ==========
const moonTexture = new Image();
moonTexture.decoding = "async";
moonTexture.src = MOBILE_ASSET ? "moon_mobile.jpg" : "moon_texture_realistic.png";
let moonTextureReady = false;
moonTexture.onload = () => { moonTextureReady = true; };
moonTexture.onerror = () => { console.warn("moon_texture_realistic.png 加载失败，将使用程序生成月球底色"); };

let musicOn = false;
let rotX = 0;
let rotY = 0;
let scale = 1;
const fov = 500;
let sceneTime = 0;
let renderFrame = 0;
let idleFrames = 0;
let lastInteractionAt = performance.now();
let pageVisible = true;
document.addEventListener("visibilitychange", () => {
  pageVisible = !document.hidden;
});


// ========== 触摸状态变量 ==========
const isMobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);

// ========== 自动画质分级：电脑满画质，手机自动降载 ==========
const deviceMemory = Number(navigator.deviceMemory || 0);      // 部分浏览器支持
const cpuCores = Number(navigator.hardwareConcurrency || 0);
const isLowPowerMobile = isMobile && (
  (deviceMemory > 0 && deviceMemory <= 4) ||
  (cpuCores > 0 && cpuCores <= 4)
);
const QUALITY = !isMobile ? "high" : "low";
const USE_HEAVY_FILTERS = QUALITY === "high";
const USE_MEDIUM_FILTERS = QUALITY !== "low";

function qValue(high, medium, low) {
  return QUALITY === "high" ? high : (QUALITY === "medium" ? medium : low);
}

console.log(`[MidAutumn] quality=${QUALITY}, memory=${deviceMemory || "unknown"}GB, cores=${cpuCores || "unknown"}`);
let isDrag = false;
let touchStartX = 0;
let touchStartY = 0;
let lastX = 0;
let lastY = 0;
let startPinchDist = 0; // 双指初始距离
const TAP_THRESHOLD = 12; // 点击判定阈值，小于12像素算点击
let touchMoved = false;

// ========== 月球整体抬高 ==========
const moonWorld = { cx: 180, cy: -188, cz: 168, radius: 92 };
const moonParticles = [];

function buildMoon() {
  moonParticles.length = 0;
  const maria = [
    { lon: -22, lat: -14, r: 21, color: "#6f6b61" },
    { lon: 26, lat: 12, r: 15, color: "#757167" },
    { lon: -42, lat: 28, r: 12, color: "#68645a" },
    { lon: 6, lat: -33, r: 13, color: "#7a766d" },
    { lon: 40, lat: -12, r: 11, color: "#706c63" },
    { lon: -5, lat: 36, r: 9, color: "#7a756b" }
  ];
  const craters = [
    { lon: 0, lat: 2, r: 10, color: "#4f4b44", rim: "#b9b29f" },
    { lon: 37, lat: -18, r: 7, color: "#5a564f", rim: "#aaa391" },
    { lon: -32, lat: 32, r: 6, color: "#615d55", rim: "#b4ad9b" },
    { lon: 23, lat: 42, r: 5, color: "#67635b", rim: "#b7af9e" },
    { lon: -11, lat: 47, r: 4.5, color: "#69655d", rim: "#bbb3a2" },
    { lon: 53, lat: 2, r: 4, color: "#6a665e", rim: "#b2aa98" },
    { lon: -56, lat: -8, r: 4, color: "#69655d", rim: "#b7b09e" },
    { lon: 15, lat: 20, r: 3.2, color: "#706c64", rim: "#bcb5a2" },
    { lon: -48, lat: -30, r: 5.5, color: "#615d57", rim: "#b8b09f" },
    { lon: 48, lat: 28, r: 4.5, color: "#645f58", rim: "#b8b19f" }
  ];

  const surfaceCount = qValue(2400, 900, 420);
  for (let i = 0; i < surfaceCount; i++) {
    const lon = (Math.random() - 0.5) * 180;
    const lat = (Math.random() - 0.5) * 180;
    moonParticles.push({
      type: "surface",
      lon,
      lat,
      r: 0.22 + Math.random() * 0.40,
      baseColor: Math.random() > 0.6 ? "#e0d8c2" : (Math.random() > 0.5 ? "#c9c2b1" : "#b6b0a0")
    });
  }

  for (const m of maria) {
    const count = qValue(460, 190, 90);
    for (let i = 0; i < count; i++) {
      const ang = Math.random() * Math.PI * 2;
      const rr = Math.sqrt(Math.random()) * m.r;
      moonParticles.push({
        type: "maria",
        lon: m.lon + Math.cos(ang) * rr,
        lat: m.lat + Math.sin(ang) * rr,
        r: 0.32 + Math.random() * 0.55,
        baseColor: m.color
      });
    }
  }

  for (const c of craters) {
    const innerCount = qValue(220, 100, 48);
    const rimCount = qValue(160, 72, 34);
    for (let i = 0; i < innerCount; i++) {
      const ang = Math.random() * Math.PI * 2;
      const rr = Math.sqrt(Math.random()) * c.r;
      moonParticles.push({
        type: "crater",
        lon: c.lon + Math.cos(ang) * rr,
        lat: c.lat + Math.sin(ang) * rr,
        r: 0.28 + Math.random() * 0.40,
        baseColor: c.color
      });
    }
    for (let i = 0; i < rimCount; i++) {
      const ang = Math.random() * Math.PI * 2;
      const rr = c.r * (0.82 + Math.random() * 0.35);
      moonParticles.push({
        type: "rim",
        lon: c.lon + Math.cos(ang) * rr,
        lat: c.lat + Math.sin(ang) * rr,
        r: 0.22 + Math.random() * 0.28,
        baseColor: c.rim
      });
    }
  }
}

function getMoonSurfaceWorld(lonDeg, latDeg) {
  const phi = lonDeg * Math.PI / 180;
  const theta = latDeg * Math.PI / 180;
  return {
    x: moonWorld.cx + moonWorld.radius * Math.cos(theta) * Math.sin(phi),
    y: moonWorld.cy + moonWorld.radius * Math.sin(theta),
    z: moonWorld.cz + moonWorld.radius * Math.cos(theta) * Math.cos(phi)
  };
}

// ========== 点击月球 -> 月球表面3D落点 ==========
function getMoonSurfaceFromClick(screenX, screenY) {
  const w = window.innerWidth;
  const h = window.innerHeight;

  const ndcX = (screenX - w / 2) / scale;
  const ndcY = (screenY - h / 2) / scale;
  const z2 = 100;
  const perspective = fov / (fov + z2);

  let x1 = ndcX / perspective;
  let y1 = ndcY / perspective;
  let z1 = z2;

  let rx = x1 * Math.cos(-rotY) - z1 * Math.sin(-rotY);
  let rz_ = x1 * Math.sin(-rotY) + z1 * Math.cos(-rotY);
  let ry = y1 * Math.cos(-rotX) - rz_ * Math.sin(-rotX);
  let rz = y1 * Math.sin(-rotX) + rz_ * Math.cos(-rotX);

  const ox = 0, oy = 0, oz = 0;
  const lx = rx - ox;
  const ly = ry - oy;
  const lz = rz - oz;

  const fx = moonWorld.cx - ox;
  const fy = moonWorld.cy - oy;
  const fz = moonWorld.cz - oz;

  const a = lx * lx + ly * ly + lz * lz;
  const b = -2 * (lx * fx + ly * fy + lz * fz);
  const c = fx * fx + fy * fy + fz * fz - moonWorld.radius * moonWorld.radius;
  const disc = b * b - 4 * a * c;

  let hitX = moonWorld.cx;
  let hitY = moonWorld.cy;
  let hitZ = moonWorld.cz;

  if (disc >= 0) {
    const t = Math.min((-b - Math.sqrt(disc)) / (2 * a), (-b + Math.sqrt(disc)) / (2 * a));
    hitX = ox + lx * t;
    hitY = oy + ly * t;
    hitZ = oz + lz * t;
  }

  return { x: hitX, y: hitY, z: hitZ };
}

// ========== 嫦娥模型 ==========
const changEModel = {
  head: { x: 0, y: -8, z: 0 },
  hairBun: { x: 0, y: -12, z: 0 },
  body: { x: 0, y: 0, z: 0 },
  sleeveL: { x: -7, y: -2, z: 2 },
  sleeveR: { x: 7, y: -2, z: -2 },
  ribbon1: { x: -10, y: 3, z: 3 },
  ribbon2: { x: -14, y: 6, z: 5 },
  skirt: { x: 0, y: 7, z: 0 }
};
const chengs = [];

// ========== 嫦娥抵达月面的落点特效 ==========
const moonRipples = [];
const osmanthusPetals = [];

function screenToWorld(screenX, screenY, worldZ = 70) {
  const w = window.innerWidth;
  const h = window.innerHeight;
  const ndcX = (screenX - w / 2) / scale;
  const ndcY = (screenY - h / 2) / scale;
  const z2 = worldZ;
  const perspective = fov / (fov + z2);
  let x1 = ndcX / perspective;
  let y1 = ndcY / perspective;
  let z1 = z2;
  let x = x1 * Math.cos(-rotY) - z1 * Math.sin(-rotY);
  let z_ = x1 * Math.sin(-rotY) + z1 * Math.cos(-rotY);
  let y = y1 * Math.cos(-rotX) - z_ * Math.sin(-rotX);
  let zOut = y1 * Math.sin(-rotX) + z_ * Math.cos(-rotX);
  return { x: x, y: y, z: zOut };
}

function getViewportBottomLeftWorld(zDepth = 130) {
  return screenToWorld(0, window.innerHeight, zDepth);
}

function launchChangeE(clickX, clickY) {
  if (chengs.length > 0) return;

  const startWorld = getViewportBottomLeftWorld(130);
  const targetWorld = getMoonSurfaceFromClick(clickX, clickY);

  chengs.push({
    sx: startWorld.x,
    sy: startWorld.y,
    sz: startWorld.z,
    tx: targetWorld.x,
    ty: targetWorld.y,
    tz: targetWorld.z,
    wx: startWorld.x,
    wy: startWorld.y,
    wz: startWorld.z,
    progress: 0,
    duration: 240,
    hold: 0,
    ribbon: [],
    trail: [],
    waveTime: Math.random() * 100,
    impactTriggered: false
  });
}

function updateChangeE() {
  for (let i = chengs.length - 1; i >= 0; i--) {
    const c = chengs[i];
    c.progress += 1;
    c.waveTime += 0.055;
    const k = Math.min(1, c.progress / c.duration);
    // 缓入缓出，比原来的直线匀速更柔和
    const ease = 0.5 - 0.5 * Math.cos(Math.PI * k);
    c.wx = c.sx + (c.tx - c.sx) * ease;
    c.wy = c.sy + (c.ty - c.sy) * ease;
    // 中途向镜头方向“拱”出来一点，形成明显的3D飞行弧线
    const depthArc = -24 * Math.sin(Math.PI * k);
    c.wz = c.sz + (c.tz - c.sz) * ease + depthArc;

    const waveOffset = Math.sin(c.waveTime) * 2.2;
    const ribbonEndX = c.wx + changEModel.ribbon2.x + waveOffset;
    const ribbonEndY = c.wy + changEModel.ribbon2.y;
    const ribbonEndZ = c.wz + changEModel.ribbon2.z;
    c.ribbon.push({ x: ribbonEndX, y: ribbonEndY, z: ribbonEndZ, life: 1 });
    if (c.ribbon.length > 48) c.ribbon.shift();

    if (Math.random() < 0.6) {
      c.trail.push({
        x: c.wx + (Math.random() - 0.5) * 8,
        y: c.wy + (Math.random() - 0.5) * 8,
        z: c.wz + (Math.random() - 0.5) * 10,
        life: 1
      });
    }
    if (c.trail.length > 130) c.trail.shift();

    for (const r of c.ribbon) r.life -= 0.024;
    for (const t of c.trail) t.life -= 0.021;
    c.ribbon = c.ribbon.filter(r => r.life > 0);
    c.trail = c.trail.filter(t => t.life > 0);

    if (k >= 1) {
      if (!c.impactTriggered) {
        c.impactTriggered = true;
        triggerMoonArrivalEffect(c.tx, c.ty, c.tz);
      }
      c.hold++;
      if (c.hold > 120) {
        chengs.splice(i, 1);
      }
    }
  }
}


function triggerMoonArrivalEffect(x, y, z) {
  moonRipples.push({ x, y, z, life: 1, radius: 3 });

  const petalCount = isMobile ? 10 : 16;
  for (let i = 0; i < petalCount; i++) {
    const ang = Math.random() * Math.PI * 2;
    const spd = 0.45 + Math.random() * 1.10;
    osmanthusPetals.push({
      x: x + (Math.random() - 0.5) * 3,
      y: y + (Math.random() - 0.5) * 3,
      z: z - 2 + (Math.random() - 0.5) * 5,
      vx: Math.cos(ang) * spd,
      vy: Math.sin(ang) * spd * 0.55 - 0.25,
      vz: (Math.random() - 0.5) * 0.65,
      rot: Math.random() * Math.PI * 2,
      vr: (Math.random() - 0.5) * 0.12,
      size: 1.4 + Math.random() * 1.8,
      life: 1,
      sway: Math.random() * Math.PI * 2
    });
  }
}

function updateMoonArrivalEffects() {
  for (let i = moonRipples.length - 1; i >= 0; i--) {
    const r = moonRipples[i];
    r.radius += 0.72;
    r.life -= 0.018;
    if (r.life <= 0) moonRipples.splice(i, 1);
  }

  for (let i = osmanthusPetals.length - 1; i >= 0; i--) {
    const p = osmanthusPetals[i];
    p.sway += 0.055;
    p.x += p.vx + Math.sin(p.sway) * 0.05;
    p.y += p.vy + Math.cos(p.sway * 0.8) * 0.035;
    p.z += p.vz;
    p.vx *= 0.988;
    p.vy += 0.010;
    p.vz *= 0.985;
    p.rot += p.vr;
    p.life -= 0.0105;
    if (p.life <= 0) osmanthusPetals.splice(i, 1);
  }
}

function drawMoonArrivalEffects() {
  // 月面金色涟漪：很轻，不盖住月面纹理
  for (const r0 of moonRipples) {
    const p = project(r0.x, r0.y, r0.z - 1.5);
    if (p.z <= -450) continue;
    const rr = r0.radius * p.scale;
    ctx.save();
    ctx.globalCompositeOperation = 'screen';
    ctx.strokeStyle = `rgba(255,214,118,${0.34 * r0.life})`;
    ctx.lineWidth = Math.max(0.65, 1.35 * p.scale * r0.life);
    ctx.beginPath();
    ctx.ellipse(p.x, p.y, rr * 1.25, rr * 0.50, -0.18, 0, Math.PI * 2);
    ctx.stroke();

    ctx.strokeStyle = `rgba(255,240,190,${0.16 * r0.life})`;
    ctx.lineWidth = Math.max(0.45, 0.75 * p.scale);
    ctx.beginPath();
    ctx.ellipse(p.x, p.y, rr * 0.82, rr * 0.32, -0.18, 0, Math.PI * 2);
    ctx.stroke();
    ctx.restore();
  }

  // 少量桂花花瓣
  for (const petal of osmanthusPetals) {
    const p = project(petal.x, petal.y, petal.z);
    if (p.z <= -450) continue;
    const s = petal.size * p.scale;
    ctx.save();
    ctx.translate(p.x, p.y);
    ctx.rotate(petal.rot);
    ctx.globalAlpha = Math.max(0, petal.life) * 0.90;
    ctx.fillStyle = 'rgba(255,201,88,0.95)';
    ctx.shadowColor = 'rgba(255,210,100,0.30)';
    ctx.shadowBlur = Math.max(1, 2.5 * p.scale);
    for (let j = 0; j < 4; j++) {
      ctx.rotate(Math.PI / 2);
      ctx.beginPath();
      ctx.ellipse(s * 0.34, 0, s * 0.42, s * 0.20, 0, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.fillStyle = 'rgba(255,235,165,0.95)';
    ctx.beginPath();
    ctx.arc(0, 0, s * 0.15, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }
}

function project(x, y, z) {
  const w = window.innerWidth;
  const h = window.innerHeight;
  let y1 = y * Math.cos(rotX) - z * Math.sin(rotX);
  let z1 = y * Math.sin(rotX) + z * Math.cos(rotX);
  let x1 = x * Math.cos(rotY) + z1 * Math.sin(rotY);
  let z2 = -x * Math.sin(rotY) + z1 * Math.cos(rotY);
  const perspective = fov / (fov + z2);
  const sx = w / 2 + x1 * perspective * scale;
  const sy = h / 2 + y1 * perspective * scale;
  const s = perspective * scale;
  return { x: sx, y: sy, scale: s, z: z2 };
}

function drawChangeE() {
  for (const c of chengs) {
    const waveOffset = Math.sin(c.waveTime) * 1.8;

    // 粒子尾迹：更细、更有远近层次
    for (const t of c.trail) {
      const tp = project(t.x, t.y, t.z);
      if (tp.z > -450) {
        const depthAlpha = Math.max(0.18, Math.min(0.9, tp.scale));
        ctx.beginPath();
        ctx.arc(tp.x, tp.y, Math.max(0.45, 0.9 * tp.scale), 0, Math.PI * 2);
        ctx.fillStyle = `rgba(255,220,135,${t.life * 0.5 * depthAlpha})`;
        ctx.fill();
      }
    }

    // 飞行轨迹丝线
    for (let i = 1; i < c.ribbon.length; i++) {
      const a = c.ribbon[i - 1];
      const b = c.ribbon[i];
      const ap = project(a.x, a.y, a.z);
      const bp = project(b.x, b.y, b.z);
      if (ap.z > -450 && bp.z > -450) {
        ctx.strokeStyle = `rgba(255,228,170,${a.life * 0.48})`;
        ctx.lineWidth = Math.max(0.6, 1.2 * ap.scale);
        ctx.beginPath();
        ctx.moveTo(ap.x, ap.y);
        ctx.lineTo(bp.x, bp.y);
        ctx.stroke();
      }
    }

    const p = project(c.wx, c.wy, c.wz);
    if (p.z <= -450) continue;

    const k = Math.min(1, c.progress / c.duration);
    let alpha = 1;
    if (k < 0.10) alpha = k / 0.10;
    if (k >= 1 && c.hold > 80) alpha = Math.max(0, 1 - (c.hold - 80) / 40);

    // 伪3D：位移、俯仰、横向透视压缩、近大远小
    const floatY = Math.sin(c.waveTime * 0.86) * 1.6 * p.scale;
    const floatX = Math.cos(c.waveTime * 0.52) * 0.85 * p.scale;
    const yaw = Math.sin(c.waveTime * 0.38) * 0.23;
    const tilt = -0.05 + Math.sin(c.waveTime * 0.32) * 0.045;
    const perspectiveX = 1 - Math.abs(yaw) * 0.32;
    const depthPulse = 1 + Math.sin(c.waveTime * 0.65) * 0.025;

    // 再缩小一档
    const baseH = isMobile ? 66 : 88;
    const imgH = baseH * p.scale * depthPulse;
    const imgW = imgH * 0.75;

    ctx.save();
    ctx.translate(p.x + floatX, p.y + floatY);
    ctx.rotate(tilt);
    ctx.transform(1, 0, yaw, 1, 0, 0);
    ctx.scale(perspectiveX, 1);
    ctx.globalAlpha = alpha;

    if (changEImageReady) {
      // 暗部“厚度”：只做很轻的偏移阴影，不再画外层光圈
      ctx.save();
      ctx.translate(imgW * 0.045, imgH * 0.028);
      ctx.globalAlpha = 0.22 * alpha;
      if (USE_MEDIUM_FILTERS) ctx.filter = `blur(${Math.max(0.8, 1.8 * p.scale)}px)`;
      ctx.drawImage(changEImage, -imgW * 0.52, -imgH * 0.56, imgW * 1.04, imgH * 1.04);
      ctx.restore();

      // 主人物：阴影+高光形成体积，不加外圈
      ctx.save();
      if (USE_MEDIUM_FILTERS) ctx.filter = `drop-shadow(${0.9 * p.scale}px ${1.6 * p.scale}px ${Math.max(1.2, 2.7 * p.scale)}px rgba(0,0,12,0.42))`;
      ctx.drawImage(changEImage, -imgW * 0.52, -imgH * 0.56, imgW * 1.04, imgH * 1.04);
      ctx.restore();

      // 局部月光：越靠近月亮越明显，让人物真正“吃到”月光
      const distToMoon = Math.hypot(c.wx - moonWorld.cx, c.wy - moonWorld.cy, c.wz - moonWorld.cz);
      const moonLightBoost = Math.max(0, Math.min(1, 1 - (distToMoon - moonWorld.radius) / 120));
      ctx.save();
      ctx.globalCompositeOperation = 'screen';
      const light = ctx.createLinearGradient(-imgW * 0.42, -imgH * 0.52, imgW * 0.38, imgH * 0.18);
      light.addColorStop(0, `rgba(255,255,255,${0.12 + 0.12 * moonLightBoost})`);
      light.addColorStop(0.35, `rgba(255,244,212,${0.05 + 0.08 * moonLightBoost})`);
      light.addColorStop(1, 'rgba(255,255,255,0)');
      ctx.fillStyle = light;
      ctx.beginPath();
      ctx.ellipse(-imgW * 0.03, -imgH * 0.15, imgW * 0.36, imgH * 0.38, -0.10, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    } else {
      ctx.fillStyle = '#fff4c2';
      ctx.beginPath();
      ctx.arc(0, 0, 4.5 * p.scale, 0, Math.PI * 2);
      ctx.fill();
    }

    // 前景丝带：和主体分层，产生前后遮挡感
    ctx.save();
    ctx.globalAlpha = 0.64 * alpha;
    ctx.strokeStyle = 'rgba(255,233,190,0.85)';
    ctx.lineWidth = Math.max(0.8, 1.45 * p.scale);
    ctx.beginPath();
    ctx.moveTo(-imgW * 0.02, imgH * 0.02);
    ctx.bezierCurveTo(
      -imgW * 0.30 - waveOffset * 1.4,
      -imgH * 0.06,
      -imgW * 0.58 - waveOffset * 2.2,
      imgH * 0.10,
      -imgW * 0.78 - waveOffset * 3.0,
      0
    );
    ctx.stroke();
    ctx.restore();

    ctx.restore();
  }
}

// ========== 绘制3D月球 ==========
function drawMoon() {
  const centerProj = project(moonWorld.cx, moonWorld.cy, moonWorld.cz);
  const r = moonWorld.radius * centerProj.scale;
  if (r <= 1) return;

  const cx = centerProj.x;
  const cy = centerProj.y;

  // 手机端使用轻量3D月球：保留纹理和球体明暗，但避免每帧大量滤镜/渐变/闪点
  if (isMobile) {
    ctx.save();
    ctx.beginPath();
    ctx.arc(cx, cy, r, 0, Math.PI * 2);
    ctx.clip();

    ctx.fillStyle = '#c9c4b8';
    ctx.fillRect(cx-r, cy-r, r*2, r*2);

    if (moonTextureReady) {
      const texW = r * 2.02;
      const texH = r * 2.02;
      ctx.globalAlpha = 0.98;
      ctx.drawImage(moonTexture, cx-texW/2, cy-texH/2, texW, texH);
    }

    const light = ctx.createRadialGradient(cx-r*0.30, cy-r*0.33, 0, cx-r*0.08, cy-r*0.10, r*0.95);
    light.addColorStop(0, 'rgba(255,252,238,0.28)');
    light.addColorStop(0.45, 'rgba(255,240,205,0.08)');
    light.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = light;
    ctx.fillRect(cx-r, cy-r, r*2, r*2);

    const limb = ctx.createRadialGradient(cx, cy, r*0.62, cx, cy, r);
    limb.addColorStop(0, 'rgba(0,0,0,0)');
    limb.addColorStop(1, 'rgba(8,8,12,0.34)');
    ctx.fillStyle = limb;
    ctx.fillRect(cx-r, cy-r, r*2, r*2);
    ctx.restore();

    ctx.save();
    ctx.strokeStyle = 'rgba(255,246,220,0.40)';
    ctx.lineWidth = 0.9;
    ctx.beginPath();
    ctx.arc(cx, cy, r-0.7, 0, Math.PI*2);
    ctx.stroke();
    ctx.restore();
    return;
  }

  ctx.save();
  ctx.beginPath();
  ctx.arc(cx, cy, r, 0, Math.PI * 2);
  ctx.clip();

  // 梦幻月球底色：暖白 + 淡金 + 冷灰阴影
  const base = ctx.createRadialGradient(
    cx - r * 0.30,
    cy - r * 0.34,
    r * 0.03,
    cx + r * 0.10,
    cy + r * 0.12,
    r * 1.15
  );
  base.addColorStop(0.00, '#fffdf2');
  base.addColorStop(0.20, '#f7efd9');
  base.addColorStop(0.48, '#d7d0c1');
  base.addColorStop(0.74, '#aaa7a3');
  base.addColorStop(1.00, '#66666b');
  ctx.fillStyle = base;
  ctx.fillRect(cx - r, cy - r, r * 2, r * 2);

  if (moonTextureReady) {
    // 视角变化时贴图轻微移动，营造缓慢自转的错觉
    const texShiftX = (Math.sin(rotY * 0.60) * 0.10 + Math.sin(sceneTime * 0.00020) * 0.035) * r;
    const texShiftY = (Math.sin(rotX * 0.50) * 0.045 + Math.cos(sceneTime * 0.00017) * 0.018) * r;
    const texScale = 2.04;
    const texW = r * texScale;
    const texH = r * texScale;

    // 柔化底层纹理
    ctx.save();
    ctx.globalAlpha = 0.20;
    if (USE_HEAVY_FILTERS) ctx.filter = `blur(${Math.max(1.0, 1.8 * centerProj.scale)}px)`;
    ctx.drawImage(moonTexture,
      cx - texW * 0.5 + texShiftX * 0.55,
      cy - texH * 0.5 + texShiftY * 0.55,
      texW, texH);
    ctx.restore();

    // 主月面
    ctx.save();
    ctx.globalAlpha = 0.90;
    if (USE_MEDIUM_FILTERS) ctx.filter = 'contrast(1.04) brightness(1.07) saturate(0.88)';
    ctx.drawImage(moonTexture,
      cx - texW * 0.5 + texShiftX,
      cy - texH * 0.5 + texShiftY,
      texW, texH);
    ctx.restore();
  }

  // 月面柔暖高光，仅在球体内部
  const warmLight = ctx.createRadialGradient(
    cx - r * 0.34,
    cy - r * 0.34,
    0,
    cx - r * 0.14,
    cy - r * 0.14,
    r * 0.82
  );
  warmLight.addColorStop(0, 'rgba(255,255,245,0.30)');
  warmLight.addColorStop(0.28, 'rgba(255,241,205,0.13)');
  warmLight.addColorStop(0.70, 'rgba(255,229,181,0.035)');
  warmLight.addColorStop(1, 'rgba(255,255,255,0)');
  ctx.fillStyle = warmLight;
  ctx.fillRect(cx-r, cy-r, 2*r, 2*r);

  // 淡淡冷色反射，让月球有“月华”层次
  const coolSheen = ctx.createLinearGradient(cx-r, cy+r*0.15, cx+r, cy-r*0.15);
  coolSheen.addColorStop(0, 'rgba(185,205,235,0.07)');
  coolSheen.addColorStop(0.45, 'rgba(255,255,255,0)');
  coolSheen.addColorStop(1, 'rgba(255,235,195,0.07)');
  ctx.fillStyle = coolSheen;
  ctx.fillRect(cx-r, cy-r, 2*r, 2*r);

  // 右下暗面，保留明显球形体积
  const shadow = ctx.createRadialGradient(
    cx + r * 0.34,
    cy + r * 0.26,
    r * 0.08,
    cx + r * 0.12,
    cy + r * 0.12,
    r * 1.08
  );
  shadow.addColorStop(0, 'rgba(0,0,0,0.02)');
  shadow.addColorStop(0.56, 'rgba(20,20,26,0.05)');
  shadow.addColorStop(1, 'rgba(9,10,18,0.27)');
  ctx.fillStyle = shadow;
  ctx.fillRect(cx-r, cy-r, 2*r, 2*r);

  // 球体边缘压暗，但不过重
  const limb = ctx.createRadialGradient(cx, cy, r * 0.58, cx, cy, r);
  limb.addColorStop(0, 'rgba(0,0,0,0)');
  limb.addColorStop(0.78, 'rgba(15,15,20,0.025)');
  limb.addColorStop(1, 'rgba(8,8,14,0.30)');
  ctx.fillStyle = limb;
  ctx.fillRect(cx-r, cy-r, 2*r, 2*r);

  // 少量珠光闪点：只画在月球内部，避免外圈光晕
  ctx.save();
  ctx.globalCompositeOperation = 'screen';
  const sparkleCount = isMobile ? 22 : 36;
  for (let i = 0; i < sparkleCount; i++) {
    const a = i * 2.399963229728653;
    const rr = r * (0.14 + 0.70 * (((i * 37) % 101) / 101));
    const sx = cx + Math.cos(a) * rr;
    const sy = cy + Math.sin(a) * rr * 0.88;
    const sr = Math.max(0.35, r * (0.0025 + (i % 4) * 0.0007));
    const sg = ctx.createRadialGradient(sx, sy, 0, sx, sy, sr * 4.2);
    sg.addColorStop(0, 'rgba(255,250,226,0.30)');
    sg.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = sg;
    ctx.beginPath();
    ctx.arc(sx, sy, sr * 4.2, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.restore();

  // 轻薄“雾感”质感，增加梦幻氛围但不模糊月纹
  const mist = ctx.createRadialGradient(cx-r*0.18, cy-r*0.12, r*0.08, cx, cy, r*0.92);
  mist.addColorStop(0, 'rgba(255,248,225,0.055)');
  mist.addColorStop(0.65, 'rgba(255,255,255,0.018)');
  mist.addColorStop(1, 'rgba(255,255,255,0)');
  ctx.fillStyle = mist;
  ctx.fillRect(cx-r, cy-r, 2*r, 2*r);

  ctx.restore();

  // 只保留精细月缘，不画外部大光圈
  ctx.save();
  ctx.strokeStyle = 'rgba(255,247,224,0.46)';
  ctx.lineWidth = Math.max(0.75, 1.0 * centerProj.scale);
  ctx.beginPath();
  ctx.arc(cx, cy, r - 0.7, 0, Math.PI * 2);
  ctx.stroke();

  // 左上受光边缘更亮，右下自然消失
  const rimGrad = ctx.createLinearGradient(cx-r, cy-r, cx+r*0.45, cy+r*0.45);
  rimGrad.addColorStop(0, 'rgba(255,255,245,0.72)');
  rimGrad.addColorStop(0.42, 'rgba(255,241,205,0.22)');
  rimGrad.addColorStop(1, 'rgba(255,255,255,0)');
  ctx.strokeStyle = rimGrad;
  ctx.lineWidth = Math.max(1.0, 1.55 * centerProj.scale);
  ctx.beginPath();
  ctx.arc(cx, cy, r - 1.2, Math.PI * 1.06, Math.PI * 1.61);
  ctx.stroke();
  ctx.restore();

  if (moonHover) {
    ctx.save();
    ctx.strokeStyle = 'rgba(255,235,175,0.22)';
    ctx.lineWidth = Math.max(0.8, 1.25 * centerProj.scale);
    ctx.beginPath();
    ctx.arc(cx, cy, r + 2.0 * centerProj.scale, 0, Math.PI * 2);
    ctx.stroke();
    ctx.restore();
  }
}

function shadeColor(hex, brightness) {
  const c = hex.replace("#", "");
  const r = parseInt(c.substring(0, 2), 16);
  const g = parseInt(c.substring(2, 4), 16);
  const b = parseInt(c.substring(4, 6), 16);
  const nr = Math.min(255, Math.floor(r * brightness));
  const ng = Math.min(255, Math.floor(g * brightness));
  const nb = Math.min(255, Math.floor(b * brightness));
  return `rgb(${nr}, ${ng}, ${nb})`;
}

// ========== 月球点击判定范围放大 ==========
function hitMoonScreen(px, py) {
  const cp = project(moonWorld.cx, moonWorld.cy, moonWorld.cz);
  const rScreen = moonWorld.radius * cp.scale;
  const dx = px - cp.x;
  const dy = py - cp.y;
  return Math.sqrt(dx * dx + dy * dy) < rScreen + 36;
}

// ========== PC点击事件 ==========
canvas.addEventListener("click", e => {
  if (hitMoonScreen(e.clientX, e.clientY)) {
    launchChangeE(e.clientX, e.clientY);
  } else {
    fireAtPoint(e.clientX, e.clientY);
  }
});

// ========== 移动端触摸事件【单指旋转 + 双指捏合缩放】 ==========
canvas.addEventListener("touchstart", e => {
  e.preventDefault();
  const touches = e.touches;
  if(touches.length === 1) {
    isDrag = false;
    touchMoved = false;
    const t = touches[0];
    touchStartX = t.clientX;
    touchStartY = t.clientY;
    lastX = t.clientX;
    lastY = t.clientY;
  } else if(touches.length === 2) {
    // 双指按下，记录初始两指距离
    touchMoved = true;
    const t1 = touches[0];
    const t2 = touches[1];
    startPinchDist = getTouchDistance(t1, t2);
  }
}, { passive: false });

canvas.addEventListener("touchmove", e => {
  e.preventDefault();
  const touches = e.touches;
  if(touches.length === 1) {
    // 单指：旋转
    const t = touches[0];
    const dx = t.clientX - touchStartX;
    const dy = t.clientY - touchStartY;
    const dist = Math.sqrt(dx*dx + dy*dy);
    if(dist > TAP_THRESHOLD) {
      touchMoved = true;
      isDrag = true;
      rotY -= dx * 0.005;
      rotX += dy * 0.005;
      touchStartX = t.clientX;
      touchStartY = t.clientY;
    }
  } else if(touches.length === 2) {
    // 双指捏合缩放逻辑
    touchMoved = true;
    const t1 = touches[0];
    const t2 = touches[1];
    const currentDist = getTouchDistance(t1, t2);
    const scaleRatio = currentDist / startPinchDist;
    scale = scale * scaleRatio;
    scale = Math.max(0.4, Math.min(2.2, scale));
    startPinchDist = currentDist;
  }
}, { passive: false });

canvas.addEventListener("touchend", e => {
  if(!touchMoved) {
    // 轻点，触发点击
    const tx = touchStartX;
    const ty = touchStartY;
    if (hitMoonScreen(tx, ty)) {
      launchChangeE(tx, ty);
    } else {
      fireAtPoint(tx, ty);
    }
  }
  isDrag = false;
  touchMoved = false;
}, { passive: false });

// 获取两点距离工具函数
function getTouchDistance(p1, p2) {
  const dx = p2.clientX - p1.clientX;
  const dy = p2.clientY - p1.clientY;
  return Math.sqrt(dx * dx + dy * dy);
}

function resize() {
  const dpr = isMobile
    ? 0.78
    : Math.min(window.devicePixelRatio || 1, 2);
  canvas.width = Math.floor(window.innerWidth * dpr);
  canvas.height = Math.floor(window.innerHeight * dpr);
  canvas.style.width = window.innerWidth + "px";
  canvas.style.height = window.innerHeight + "px";
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  if (isMobile) textParticles.length = 0; else initTextParticles();
  initBgParticles();
  initMist();
}

window.addEventListener("resize", resize);
window.addEventListener("orientationchange", () => setTimeout(resize, 120));

resetBtn.addEventListener("click", () => {
  rotX = 0; rotY = 0; scale = 1;
  markInteraction();
});

canvas.addEventListener("mousedown", e => { isDrag = true; lastX = e.clientX; lastY = e.clientY; });
window.addEventListener("mousemove", e => {
  if (!isDrag) return;
  const dx = e.clientX - lastX;
  const dy = e.clientY - lastY;
  rotY -= dx * 0.005;
  rotX += dy * 0.005;
  lastX = e.clientX; lastY = e.clientY;
});
window.addEventListener("mouseup", () => { isDrag = false; });

canvas.addEventListener("wheel", e => {
  e.preventDefault();
  scale += e.deltaY * -0.0008;
  scale = Math.max(0.4, Math.min(2.2, scale));
}, { passive: false });

musicBtn.addEventListener("click", e => {
  e.stopPropagation();
  if (bgMusic.paused) {
    bgMusic.volume = 0.6;
    bgMusic.play().then(() => {
      musicOn = true;
      musicBtn.innerText = "音乐播放中 · 点击暂停";
    }).catch(err => {
      musicBtn.innerText = "音乐加载失败";
      console.error(err);
    });
  } else {
    bgMusic.pause();
    musicOn = false;
    musicBtn.innerText = "点击开启音乐";
  }
});

function fireAtPoint(px, py) {
  const worldPos = screenToWorld(px, py, 70);
  const count = isMobile ? 18 : 60;
  for (let i = 0; i < count; i++) {
    if (fireworkParticles.length >= MAX_FIREWORK) fireworkParticles.shift();
    fireworkParticles.push(new FireworkParticle(worldPos.x, worldPos.y, worldPos.z));
  }
}

// ========== 背景星星 ==========
let bgParticles = [];
const BG_COUNT = isMobile ? 42 : 280;
function initBgParticles() {
  bgParticles.length = 0;
  for (let i = 0; i < BG_COUNT; i++) bgParticles.push(new BgParticle());
}
class BgParticle {
  constructor() { this.reset(); }
  reset() {
    this.x = (Math.random() - 0.5) * 900;
    this.y = (Math.random() - 0.5) * 700;
    this.z = (Math.random() - 0.5) * 500;
    this.r = Math.random() * 1.2 + 0.3;
    this.vx = (Math.random() - 0.5) * 0.22;
    this.vy = (Math.random() - 0.5) * 0.22;
    this.vz = (Math.random() - 0.5) * 0.12;
    this.a = Math.random() * 0.35 + 0.18;
    this.color = Math.random() > 0.5 ? "180, 210, 255" : "255, 248, 204";
    this.twinkle = Math.random() * Math.PI * 2;
    this.twinkleSpeed = 0.015 + Math.random() * 0.03;
  }
  update() {
    this.x += this.vx; this.y += this.vy; this.z += this.vz;
    this.twinkle += this.twinkleSpeed;
    if (Math.abs(this.x) > 450 || Math.abs(this.y) > 350 || Math.abs(this.z) > 280) this.reset();
    const p = project(this.x, this.y, this.z);
    if (p.z > -450) {
      const flicker = 0.72 + 0.28 * Math.sin(this.twinkle);
      const rr = this.r * p.scale * (0.92 + 0.10 * Math.sin(this.twinkle * 0.7));
      ctx.beginPath();
      ctx.arc(p.x, p.y, Math.max(0.25, rr), 0, Math.PI * 2);
      ctx.fillStyle = `rgba(${this.color}, ${this.a * flicker * Math.min(1, p.scale)})`;
      ctx.fill();
    }
  }
}


// ========== 梦幻天空层：薄雾、星云、流星 ==========
let mistParticles = [];
let shootingStars = [];
let nextMeteorTime = 2600 + Math.random() * 3500;

function markInteraction() {
  lastInteractionAt = performance.now();
  document.body.classList.remove('ui-idle');
}

['pointerdown','pointermove','wheel','touchstart'].forEach(evt => {
  window.addEventListener(evt, markInteraction, { passive: true });
});

function drawSkyAtmosphere() {
  const w = window.innerWidth;
  const h = window.innerHeight;
  const t = sceneTime * 0.00012;

  // 左下冷色星云
  let g = ctx.createRadialGradient(w * (0.18 + Math.sin(t) * 0.015), h * 0.80, 0, w * 0.18, h * 0.80, Math.max(w,h) * 0.48);
  g.addColorStop(0, 'rgba(74,72,130,0.075)');
  g.addColorStop(0.45, 'rgba(46,42,90,0.032)');
  g.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = g;
  ctx.fillRect(0,0,w,h);

  // 月亮附近的暖色环境光，不画环，仅作为天空色偏
  g = ctx.createRadialGradient(w * 0.72, h * 0.20, 0, w * 0.72, h * 0.20, Math.max(w,h) * 0.38);
  g.addColorStop(0, 'rgba(255,231,180,0.038)');
  g.addColorStop(0.6, 'rgba(255,220,160,0.010)');
  g.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = g;
  ctx.fillRect(0,0,w,h);
}

class MistParticle {
  constructor() { this.reset(true); }
  reset(initial=false) {
    this.x = Math.random() * window.innerWidth;
    this.y = window.innerHeight * (0.68 + Math.random() * 0.36);
    this.rx = 55 + Math.random() * 120;
    this.ry = 10 + Math.random() * 25;
    this.vx = 0.035 + Math.random() * 0.08;
    this.alpha = 0.010 + Math.random() * 0.018;
    this.phase = Math.random() * Math.PI * 2;
    if (!initial) this.x = -this.rx * 2;
  }
  update() {
    this.x += this.vx;
    this.phase += 0.002;
    if (this.x > window.innerWidth + this.rx * 2) this.reset(false);
  }
  draw() {
    const y = this.y + Math.sin(this.phase) * 4;
    const g = ctx.createRadialGradient(this.x, y, 0, this.x, y, this.rx);
    g.addColorStop(0, `rgba(210,220,245,${this.alpha})`);
    g.addColorStop(0.55, `rgba(175,185,220,${this.alpha * 0.55})`);
    g.addColorStop(1, 'rgba(150,160,200,0)');
    ctx.save();
    ctx.scale(1, this.ry / this.rx);
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(this.x, y * (this.rx / this.ry), this.rx, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }
}

function initMist() {
  mistParticles = isMobile ? [] : Array.from({length: 14}, () => new MistParticle());
}

class ShootingStar {
  constructor() {
    this.x = window.innerWidth * (0.20 + Math.random() * 0.65);
    this.y = -30 - Math.random() * 80;
    this.vx = -(6.0 + Math.random() * 3.8);
    this.vy = 3.6 + Math.random() * 2.6;
    this.life = 1;
    this.len = 125 + Math.random() * 125;
  }
  update() {
    this.x += this.vx;
    this.y += this.vy;
    this.life -= 0.0085;
  }
  draw() {
    const speed = Math.hypot(this.vx, this.vy) || 1;
    const ux = this.vx / speed, uy = this.vy / speed;
    const ex = this.x - ux * this.len;
    const ey = this.y - uy * this.len;
    const g = ctx.createLinearGradient(this.x, this.y, ex, ey);
    g.addColorStop(0, `rgba(255,252,236,${0.98 * this.life})`);
    g.addColorStop(0.22, `rgba(205,228,255,${0.62 * this.life})`);
    g.addColorStop(1, 'rgba(180,205,255,0)');
    ctx.strokeStyle = g;
    ctx.lineWidth = isMobile ? 1.5 : 2.2;
    ctx.beginPath();
    ctx.moveTo(this.x, this.y);
    ctx.lineTo(ex, ey);
    ctx.stroke();

    ctx.save();
    ctx.globalCompositeOperation = 'screen';
    const hg = ctx.createRadialGradient(this.x, this.y, 0, this.x, this.y, 9);
    hg.addColorStop(0, `rgba(255,255,245,${0.95 * this.life})`);
    hg.addColorStop(0.35, `rgba(210,230,255,${0.55 * this.life})`);
    hg.addColorStop(1, 'rgba(180,210,255,0)');
    ctx.fillStyle = hg;
    ctx.beginPath();
    ctx.arc(this.x, this.y, 9, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }
}

function updateAmbientEffects() {
  for (const m of mistParticles) { m.update(); m.draw(); }

  if (sceneTime >= nextMeteorTime && shootingStars.length < (QUALITY === "low" ? 1 : 2)) {
    shootingStars.push(new ShootingStar());
    nextMeteorTime = sceneTime + qValue(4200, 5200, 6500) + Math.random() * qValue(4800, 5200, 6200);
  }
  for (let i = shootingStars.length - 1; i >= 0; i--) {
    const s = shootingStars[i];
    s.update();
    s.draw();
    if (s.life <= 0 || s.x < -180 || s.y > window.innerHeight + 180) shootingStars.splice(i,1);
  }
}


// ========== 月边金尘：非常克制的环月微粒 ==========
const moonDust = [];
function initMoonDust() {
  moonDust.length = 0;
  const count = isMobile ? 6 : 30;
  for (let i = 0; i < count; i++) {
    moonDust.push({
      angle: Math.random() * Math.PI * 2,
      radius: 1.08 + Math.random() * 0.22,
      speed: (0.00025 + Math.random() * 0.00038) * (Math.random() > 0.5 ? 1 : -1),
      phase: Math.random() * Math.PI * 2,
      size: 0.55 + Math.random() * 1.1,
      alpha: 0.10 + Math.random() * 0.22
    });
  }
}

function drawMoonDust() {
  const cp = project(moonWorld.cx, moonWorld.cy, moonWorld.cz);
  const r = moonWorld.radius * cp.scale;
  if (r < 3) return;

  for (const d of moonDust) {
    d.angle += d.speed * 16.67;
    d.phase += 0.018;
    const ellipseY = 0.54;
    const x = cp.x + Math.cos(d.angle) * r * d.radius;
    const y = cp.y + Math.sin(d.angle) * r * d.radius * ellipseY;
    const front = Math.sin(d.angle) > -0.18;
    if (!front) continue;

    const a = d.alpha * (0.66 + 0.34 * Math.sin(d.phase));
    ctx.save();
    ctx.globalCompositeOperation = 'screen';
    ctx.fillStyle = `rgba(255,225,155,${a})`;
    ctx.shadowColor = `rgba(255,215,140,${a * 0.65})`;
    ctx.shadowBlur = 4;
    ctx.beginPath();
    ctx.arc(x, y, Math.max(0.35, d.size * cp.scale), 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }
}

// ========== 电影感收尾：轻微暗角 + 中心通透 ==========
function drawCinematicFinish() {
  const w = window.innerWidth;
  const h = window.innerHeight;
  const g = ctx.createRadialGradient(w * 0.52, h * 0.45, Math.min(w,h) * 0.18, w * 0.50, h * 0.50, Math.max(w,h) * 0.78);
  g.addColorStop(0, 'rgba(0,0,0,0)');
  g.addColorStop(0.62, 'rgba(0,0,0,0.015)');
  g.addColorStop(1, 'rgba(0,0,0,0.22)');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, w, h);
}

// ========== 月亮悬停反馈 ==========
let moonHover = false;
canvas.addEventListener('pointermove', e => {
  moonHover = hitMoonScreen(e.clientX, e.clientY);
  canvas.style.cursor = moonHover ? 'pointer' : 'default';
});
canvas.addEventListener('pointerleave', () => {
  moonHover = false;
  canvas.style.cursor = 'default';
});

// ========== 中间文字粒子 ==========
const texts = ["中秋安康", "花好月圆"];
let textIndex = 0;
let textChangeTimer = 0;
const textChangeInterval = 240;
let textParticles = [];

class TextParticle {
  constructor(tx, ty, tz) {
    this.x = (Math.random() - 0.5) * 800;
    this.y = (Math.random() - 0.5) * 600;
    this.z = (Math.random() - 0.5) * 400;
    this.targetX = tx; this.targetY = ty; this.targetZ = tz;
    this.size = Math.random() * 1.6 + 0.8;
    this.baseAlpha = 0.85;
    this.color = Math.random() > 0.4 ? "#ffe28a" : "#fff6c2";
    this.speed = 0.06 + Math.random() * 0.03;
    this.offsetAngle = Math.random() * Math.PI * 2;
    this.offsetSpeed = 0.008 + Math.random() * 0.01;
  }
  update() {
    this.x += (this.targetX - this.x) * this.speed;
    this.y += (this.targetY - this.y) * this.speed;
    this.z += (this.targetZ - this.z) * this.speed;
    this.offsetAngle += this.offsetSpeed;
    const breathX = Math.sin(this.offsetAngle) * 0.8;
    const breathY = Math.cos(this.offsetAngle * 0.6) * 0.6;
    const twinkle = 0.85 + Math.sin(this.offsetAngle * 1.8) * 0.15;
    const p = project(this.x + breathX, this.y + breathY, this.z);
    if (p.z > -450) {
      ctx.save();
      ctx.translate(p.x, p.y);
      const ds = this.size * p.scale;
      ctx.fillStyle = this.color;
      ctx.globalAlpha = this.baseAlpha * twinkle * Math.min(1, p.scale);
      ctx.fillRect(-ds / 2, -ds / 2, ds, ds);
      ctx.restore();
    }
    ctx.globalAlpha = 1;
  }
}

function getTextPoints(text) {
  const off = document.createElement("canvas");
  const octx = off.getContext("2d");
  const fontSize = Math.min(110, window.innerWidth / 5);
  octx.font = `600 ${fontSize}px "PingFang SC", "Microsoft YaHei", sans-serif`;
  octx.textAlign = "center"; octx.textBaseline = "middle";
  const w = Math.ceil(octx.measureText(text).width) + 120;
  const h = fontSize + 60;
  off.width = w; off.height = h;
  octx.font = `600 ${fontSize}px "PingFang SC", "Microsoft YaHei", sans-serif`;
  octx.textAlign = "center"; octx.textBaseline = "middle";
  octx.fillStyle = "#ffffff";
  octx.fillText(text, w / 2, h / 2);
  const imgData = octx.getImageData(0, 0, w, h);
  const data = imgData.data;
  const points = [];
  const gap = qValue(3, 4, 5);
  for (let y = 0; y < h; y += gap) {
    for (let x = 0; x < w; x += gap) {
      const idx = (y * w + x) * 4;
      if (data[idx + 3] > 128) {
        points.push({ x: (x - w / 2) * 0.75, y: (y - h / 2) * 0.75, z: 0 });
      }
    }
  }
  return points;
}

function drawMobileTitle() {
  const p = project(0, 0, 0);
  const fontSize = Math.min(54, window.innerWidth / 7.2);
  ctx.save();
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  ctx.font = `600 ${fontSize}px "PingFang SC", "Microsoft YaHei", sans-serif`;
  ctx.fillStyle = "rgba(255,236,160,0.92)";
  ctx.shadowColor = "rgba(255,215,120,0.25)";
  ctx.shadowBlur = 3;
  ctx.fillText(texts[textIndex], p.x, p.y);
  ctx.restore();
}

function initTextParticles() {
  const pts = getTextPoints(texts[textIndex]);
  textParticles.length = 0;
  for (const p of pts) textParticles.push(new TextParticle(p.x, p.y, p.z));
}
function changeTextTarget() {
  const pts = getTextPoints(texts[textIndex]);
  for (let i = 0; i < textParticles.length; i++) {
    const p = pts[i % pts.length];
    textParticles[i].targetX = p.x;
    textParticles[i].targetY = p.y;
    textParticles[i].targetZ = p.z;
  }
}

// ========== 烟花 ==========
let fireworkParticles = [];
const MAX_FIREWORK = isMobile ? 48 : 180;
class FireworkParticle {
  constructor(x, y, z) {
    this.x = x; this.y = y; this.z = z;
    const ang = Math.random() * Math.PI * 2;
    const spd = Math.random() * 4 + 2;
    this.vx = Math.cos(ang) * spd;
    this.vy = Math.sin(ang) * spd;
    this.vz = (Math.random() - 0.5) * spd * 0.6;
    this.r = Math.random() * 2 + 1;
    this.alpha = 1;
    this.decay = 0.0019 + Math.random() * 0.0016;
    this.color = Math.random() > 0.5 ? "255,220,120" : "255,255,255";
  }
  update() {
    this.vy += 0.040;
    this.x += this.vx;
    this.y += this.vy;
    this.z += this.vz;
    this.alpha -= this.decay;
  }
  draw() {
    const p = project(this.x, this.y, this.z);
    if (p.z > -450 && this.alpha > 0) {
      ctx.save();
      ctx.globalCompositeOperation = 'screen';
      ctx.shadowColor = `rgba(${this.color},${0.45 * this.alpha})`;
      ctx.shadowBlur = USE_MEDIUM_FILTERS ? Math.max(2, 5 * p.scale) : 0;
      ctx.beginPath();
      ctx.arc(p.x, p.y, this.r * p.scale, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(${this.color},${this.alpha * Math.min(1, p.scale)})`;
      ctx.fill();
      ctx.restore();
    }
  }
}

// ========== 主循环 ==========
let lastMobileFrame = 0;
function animate(ts = 0) {
  if (!pageVisible) { requestAnimationFrame(animate); return; }
  if (isMobile && ts - lastMobileFrame < 33.3) { requestAnimationFrame(animate); return; }
  if (isMobile) lastMobileFrame = ts;
  sceneTime = ts;
  renderFrame++;

  // 轻微拖影，保留粒子的“梦幻尾迹”但避免画面糊成一片
  ctx.fillStyle = "rgba(3,4,11,0.34)";
  ctx.fillRect(0, 0, window.innerWidth, window.innerHeight);

  if (!isMobile) drawSkyAtmosphere();
  updateAmbientEffects();

  for (const p of bgParticles) p.update();

  for (let i = fireworkParticles.length - 1; i >= 0; i--) {
    const fp = fireworkParticles[i];
    fp.update();
    fp.draw();
    if (fp.alpha <= 0) fireworkParticles.splice(i, 1);
  }

  if (isMobile) drawMobileTitle(); else for (const p of textParticles) p.update();

  updateChangeE();
  updateMoonArrivalEffects();
  drawMoon();
  if (!isMobile) drawMoonDust();
  drawMoonArrivalEffects();
  drawChangeE();

  textChangeTimer++;
  if (textChangeTimer >= textChangeInterval) {
    textChangeTimer = 0;
    textIndex = (textIndex + 1) % texts.length;
    if (!isMobile) changeTextTarget();
  }

  // 一段时间没有操作后，让UI变得更安静，突出画面
  if (performance.now() - lastInteractionAt > 6500) {
    document.body.classList.add('ui-idle');
  }

  if (!isMobile) drawCinematicFinish();
  requestAnimationFrame(animate);
}

buildMoon();
initMoonDust();
resize();
animate();
</script>
