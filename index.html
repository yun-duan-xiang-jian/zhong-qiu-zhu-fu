<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>中秋 · 伪3D粒子祝福</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
  }

  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: radial-gradient(ellipse at center, #12122a 0%, #05050f 100%);
    font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
    user-select: none;
    touch-action: none;
  }

  canvas {
    display: block;
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
  }

  .top-tip {
    position: fixed;
    top: 12px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 3;
    color: #fff8cc;
    opacity: 0.7;
    font-size: 13px;
    letter-spacing: 2px;
    pointer-events: none;
    white-space: nowrap;
  }

  .music-btn {
    position: fixed;
    left: 50%;
    bottom: 44px;
    transform: translateX(-50%);
    z-index: 3;
    padding: 0 28px;
    min-width: 180px;
    max-width: 42vw;
    height: 46px;
    line-height: 44px;
    border: 1px solid rgba(255, 221, 119, 0.5);
    border-radius: 999px;
    background: rgba(10, 10, 30, 0.45);
    color: #fff4c2;
    font-size: 14px;
    letter-spacing: 4px;
    text-align: center;
    white-space: nowrap;
    cursor: pointer;
    backdrop-filter: blur(6px);
    transition: all 0.3s ease;
  }

  .music-btn:hover {
    background: rgba(255, 221, 119, 0.18);
    border-color: rgba(255, 221, 119, 0.9);
    box-shadow: 0 0 18px rgba(255, 221, 119, 0.35);
  }

  .reset-btn {
    position: fixed;
    right: 16px;
    bottom: 44px;
    z-index: 3;
    padding: 0 20px;
    min-width: 110px;
    max-width: 30vw;
    height: 46px;
    line-height: 44px;
    border: 1px solid rgba(255, 221, 119, 0.5);
    border-radius: 999px;
    background: rgba(10, 10, 30, 0.45);
    color: #fff4c2;
    font-size: 14px;
    letter-spacing: 2px;
    text-align: center;
    white-space: nowrap;
    cursor: pointer;
    backdrop-filter: blur(6px);
    transition: all 0.3s ease;
  }

  .reset-btn:hover {
    background: rgba(255, 221, 119, 0.18);
    border-color: rgba(255, 221, 119, 0.9);
    box-shadow: 0 0 18px rgba(255, 221, 119, 0.35);
  }

  audio {
    display: none;
  }

  @media (max-width: 480px) {
    .top-tip {
      font-size: 11px;
    }
    .music-btn {
      min-width: 150px;
      max-width: 46vw;
      height: 42px;
      line-height: 40px;
      font-size: 12px;
      letter-spacing: 3px;
      padding: 0 18px;
    }
    .reset-btn {
      min-width: 90px;
      max-width: 28vw;
      height: 42px;
      line-height: 40px;
      font-size: 12px;
      padding: 0 14px;
    }
  }
</style>
</head>
<body>
  <div class="top-tip">单指拖拽旋转｜双指捏合缩放｜点击月亮召唤嫦娥</div>

  <canvas id="particleCanvas"></canvas>

  <button class="music-btn" id="musicBtn">点击开启音乐</button>
  <button class="reset-btn" id="resetBtn">重置视角</button>

  <audio id="bgMusic" src="music.mp3" loop>

<script>
const canvas = document.getElementById("particleCanvas");
const ctx = canvas.getContext("2d");
const musicBtn = document.getElementById("musicBtn");
const resetBtn = document.getElementById("resetBtn");
const bgMusic = document.getElementById("bgMusic");

let musicOn = false;
let rotX = 0;
let rotY = 0;
let scale = 1;
const fov = 500;

// ========== 触摸状态变量 ==========
const isMobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
let isDrag = false;
let touchStartX = 0;
let touchStartY = 0;
let lastX = 0;
let lastY = 0;
let startPinchDist = 0; // 双指初始距离
const TAP_THRESHOLD = 12; // 点击判定阈值，小于12像素算点击
let touchMoved = false;

// ========== 月球整体抬高 ==========
const moonWorld = { cx: 180, cy: -200, cz: 160, radius: 70 };
const moonParticles = [];

function buildMoon() {
  moonParticles.length = 0;
  const maria = [
    { lon: -20, lat: -15, r: 18, color: "#6e6a5e" },
    { lon: 30, lat: 10, r: 14, color: "#757165" },
    { lon: -45, lat: 25, r: 10, color: "#6c685c" },
    { lon: 10, lat: -30, r: 12, color: "#7a766a" }
  ];
  const craters = [
    { lon: 0, lat: 0, r: 9, color: "#4b4740" },
    { lon: 40, lat: -20, r: 6, color: "#555149" },
    { lon: -35, lat: 35, r: 5, color: "#5c5850" },
    { lon: 25, lat: 40, r: 4, color: "#635f57" },
    { lon: -10, lat: 45, r: 4, color: "#66625a" },
    { lon: 55, lat: 0, r: 3, color: "#6a665e" },
    { lon: -55, lat: -10, r: 3, color: "#69655d" },
    { lon: 15, lat: 20, r: 2.5, color: "#706c64" }
  ];
  const surfaceCount = isMobile ? 900 : 1400;
  for (let i = 0; i < surfaceCount; i++) {
    const lon = (Math.random() - 0.5) * 180;
    const lat = (Math.random() - 0.5) * 180;
    moonParticles.push({ type: "surface", lon, lat, r: 0.35 + Math.random() * 0.45, baseColor: Math.random() > 0.5 ? "#cfc9b8" : "#b8b2a2" });
  }
  for (const m of maria) {
    const count = isMobile ? 180 : 280;
    for (let i = 0; i < count; i++) {
      const ang = Math.random() * Math.PI * 2;
      const rr = Math.sqrt(Math.random()) * m.r;
      moonParticles.push({ type: "maria", lon: m.lon + Math.cos(ang) * rr, lat: m.lat + Math.sin(ang) * rr, r: 0.4 + Math.random() * 0.4, baseColor: m.color });
    }
  }
  for (const c of craters) {
    const count = isMobile ? 120 : 200;
    for (let i = 0; i < count; i++) {
      const ang = Math.random() * Math.PI * 2;
      const rr = Math.sqrt(Math.random()) * c.r;
      moonParticles.push({ type: "crater", lon: c.lon + Math.cos(ang) * rr, lat: c.lat + Math.sin(ang) * rr, r: 0.35 + Math.random() * 0.35, baseColor: c.color });
    }
  }
}

function getMoonSurfaceWorld(lonDeg, latDeg) {
  const phi = lonDeg * Math.PI / 180;
  const theta = latDeg * Math.PI / 180;
  return {
    x: moonWorld.cx + moonWorld.radius * Math.cos(theta) * Math.sin(phi),
    y: moonWorld.cy + moonWorld.radius * Math.sin(theta),
    z: moonWorld.cz + moonWorld.radius * Math.cos(theta) * Math.cos(phi)
  };
}

// ========== 点击月球 -> 月球表面3D落点 ==========
function getMoonSurfaceFromClick(screenX, screenY) {
  const w = window.innerWidth;
  const h = window.innerHeight;

  const ndcX = (screenX - w / 2) / scale;
  const ndcY = (screenY - h / 2) / scale;
  const z2 = 100;
  const perspective = fov / (fov + z2);

  let x1 = ndcX / perspective;
  let y1 = ndcY / perspective;
  let z1 = z2;

  let rx = x1 * Math.cos(-rotY) - z1 * Math.sin(-rotY);
  let rz_ = x1 * Math.sin(-rotY) + z1 * Math.cos(-rotY);
  let ry = y1 * Math.cos(-rotX) - rz_ * Math.sin(-rotX);
  let rz = y1 * Math.sin(-rotX) + rz_ * Math.cos(-rotX);

  const ox = 0, oy = 0, oz = 0;
  const lx = rx - ox;
  const ly = ry - oy;
  const lz = rz - oz;

  const fx = moonWorld.cx - ox;
  const fy = moonWorld.cy - oy;
  const fz = moonWorld.cz - oz;

  const a = lx * lx + ly * ly + lz * lz;
  const b = -2 * (lx * fx + ly * fy + lz * fz);
  const c = fx * fx + fy * fy + fz * fz - moonWorld.radius * moonWorld.radius;
  const disc = b * b - 4 * a * c;

  let hitX = moonWorld.cx;
  let hitY = moonWorld.cy;
  let hitZ = moonWorld.cz;

  if (disc >= 0) {
    const t = Math.min((-b - Math.sqrt(disc)) / (2 * a), (-b + Math.sqrt(disc)) / (2 * a));
    hitX = ox + lx * t;
    hitY = oy + ly * t;
    hitZ = oz + lz * t;
  }

  return { x: hitX, y: hitY, z: hitZ };
}

// ========== 嫦娥模型 ==========
const changEModel = {
  head: { x: 0, y: -8, z: 0 },
  hairBun: { x: 0, y: -12, z: 0 },
  body: { x: 0, y: 0, z: 0 },
  sleeveL: { x: -7, y: -2, z: 2 },
  sleeveR: { x: 7, y: -2, z: -2 },
  ribbon1: { x: -10, y: 3, z: 3 },
  ribbon2: { x: -14, y: 6, z: 5 },
  skirt: { x: 0, y: 7, z: 0 }
};
const chengs = [];

function screenToWorld(screenX, screenY, worldZ = 70) {
  const w = window.innerWidth;
  const h = window.innerHeight;
  const ndcX = (screenX - w / 2) / scale;
  const ndcY = (screenY - h / 2) / scale;
  const z2 = worldZ;
  const perspective = fov / (fov + z2);
  let x1 = ndcX / perspective;
  let y1 = ndcY / perspective;
  let z1 = z2;
  let x = x1 * Math.cos(-rotY) - z1 * Math.sin(-rotY);
  let z_ = x1 * Math.sin(-rotY) + z1 * Math.cos(-rotY);
  let y = y1 * Math.cos(-rotX) - z_ * Math.sin(-rotX);
  let zOut = y1 * Math.sin(-rotX) + z_ * Math.cos(-rotX);
  return { x: x, y: y, z: zOut };
}

function getViewportBottomLeftWorld(zDepth = 130) {
  return screenToWorld(0, window.innerHeight, zDepth);
}

function launchChangeE(clickX, clickY) {
  const startWorld = getViewportBottomLeftWorld(130);
  const targetWorld = getMoonSurfaceFromClick(clickX, clickY);

  chengs.push({
    sx: startWorld.x,
    sy: startWorld.y,
    sz: startWorld.z,
    tx: targetWorld.x,
    ty: targetWorld.y,
    tz: targetWorld.z,
    wx: startWorld.x,
    wy: startWorld.y,
    wz: startWorld.z,
    progress: 0,
    duration: 140,
    hold: 0,
    ribbon: [],
    trail: [],
    waveTime: Math.random() * 100
  });
}

function updateChangeE() {
  for (let i = chengs.length - 1; i >= 0; i--) {
    const c = chengs[i];
    c.progress += 1;
    c.waveTime += 0.08;
    const k = Math.min(1, c.progress / c.duration);
    c.wx = c.sx + (c.tx - c.sx) * k;
    c.wy = c.sy + (c.ty - c.sy) * k;
    c.wz = c.sz + (c.tz - c.sz) * k;

    const waveOffset = Math.sin(c.waveTime) * 2.2;
    const ribbonEndX = c.wx + changEModel.ribbon2.x + waveOffset;
    const ribbonEndY = c.wy + changEModel.ribbon2.y;
    const ribbonEndZ = c.wz + changEModel.ribbon2.z;
    c.ribbon.push({ x: ribbonEndX, y: ribbonEndY, z: ribbonEndZ, life: 1 });
    if (c.ribbon.length > 48) c.ribbon.shift();

    if (Math.random() < 0.6) {
      c.trail.push({
        x: c.wx + (Math.random() - 0.5) * 8,
        y: c.wy + (Math.random() - 0.5) * 8,
        z: c.wz + (Math.random() - 0.5) * 10,
        life: 1
      });
    }
    if (c.trail.length > 130) c.trail.shift();

    for (const r of c.ribbon) r.life -= 0.024;
    for (const t of c.trail) t.life -= 0.021;
    c.ribbon = c.ribbon.filter(r => r.life > 0);
    c.trail = c.trail.filter(t => t.life > 0);

    if (k >= 1) {
      c.hold++;
      if (c.hold > 75) {
        chengs.splice(i, 1);
      }
    }
  }
}

function project(x, y, z) {
  const w = window.innerWidth;
  const h = window.innerHeight;
  let y1 = y * Math.cos(rotX) - z * Math.sin(rotX);
  let z1 = y * Math.sin(rotX) + z * Math.cos(rotX);
  let x1 = x * Math.cos(rotY) + z1 * Math.sin(rotY);
  let z2 = -x * Math.sin(rotY) + z1 * Math.cos(rotY);
  const perspective = fov / (fov + z2);
  const sx = w / 2 + x1 * perspective * scale;
  const sy = h / 2 + y1 * perspective * scale;
  const s = perspective * scale;
  return { x: sx, y: sy, scale: s, z: z2 };
}

function drawChangeE() {
  for (const c of chengs) {
    const waveOffset = Math.sin(c.waveTime) * 2.2;
    for (const t of c.trail) {
      const tp = project(t.x, t.y, t.z);
      if (tp.z > -450) {
        ctx.beginPath();
        ctx.arc(tp.x, tp.y, 1.2 * tp.scale, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(255,220,120,${t.life * 0.7})`;
        ctx.fill();
      }
    }
    for (let i = 1; i < c.ribbon.length; i++) {
      const a = c.ribbon[i - 1];
      const b = c.ribbon[i];
      const ap = project(a.x, a.y, a.z);
      const bp = project(b.x, b.y, b.z);
      if (ap.z > -450 && bp.z > -450) {
        ctx.strokeStyle = `rgba(255,230,170,${a.life * 0.8})`;
        ctx.lineWidth = 2 * ap.scale;
        ctx.beginPath();
        ctx.moveTo(ap.x, ap.y);
        ctx.lineTo(bp.x, bp.y);
        ctx.stroke();
      }
    }

    const headP = project(c.wx + changEModel.head.x, c.wy + changEModel.head.y, c.wz + changEModel.head.z);
    const hairP = project(c.wx + changEModel.hairBun.x, c.wy + changEModel.hairBun.y, c.wz + changEModel.hairBun.z);
    const bodyP = project(c.wx + changEModel.body.x, c.wy + changEModel.body.y, c.wz + changEModel.body.z);
    const skirtP = project(c.wx + changEModel.skirt.x, c.wy + changEModel.skirt.y, c.wz + changEModel.skirt.z);
    const sleeveLP = project(c.wx + changEModel.sleeveL.x + waveOffset, c.wy + changEModel.sleeveL.y, c.wz + changEModel.sleeveL.z);
    const sleeveRP = project(c.wx + changEModel.sleeveR.x - waveOffset, c.wy + changEModel.sleeveR.y, c.wz + changEModel.sleeveR.z);
    const rib1P = project(c.wx + changEModel.ribbon1.x + waveOffset, c.wy + changEModel.ribbon1.y, c.wz + changEModel.ribbon1.z);
    const rib2P = project(c.wx + changEModel.ribbon2.x + waveOffset, c.wy + changEModel.ribbon2.y, c.wz + changEModel.ribbon2.z);

    if (headP.z > -450 && bodyP.z > -450) {
      const ss = headP.scale;

      const glow = ctx.createRadialGradient(headP.x, headP.y, 0, headP.x, headP.y, 20 * ss);
      glow.addColorStop(0, "rgba(255, 240, 200, 0.9)");
      glow.addColorStop(0.4, "rgba(255, 220, 140, 0.45)");
      glow.addColorStop(1, "rgba(255, 200, 100, 0)");
      ctx.fillStyle = glow;
      ctx.beginPath();
      ctx.arc(headP.x, headP.y, 20 * ss, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = "#c9985c";
      ctx.beginPath();
      ctx.arc(hairP.x, hairP.y, 2.6 * ss, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = "#ffe28a";
      ctx.beginPath();
      ctx.arc(headP.x, headP.y, 3.8 * ss, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = "#fff4c2";
      ctx.beginPath();
      ctx.moveTo(sleeveLP.x, sleeveLP.y);
      ctx.lineTo(bodyP.x - 3.2 * ss, bodyP.y);
      ctx.lineTo(skirtP.x - 4.2 * ss, skirtP.y);
      ctx.lineTo(skirtP.x + 4.2 * ss, skirtP.y);
      ctx.lineTo(bodyP.x + 3.2 * ss, bodyP.y);
      ctx.lineTo(sleeveRP.x, sleeveRP.y);
      ctx.closePath();
      ctx.fill();

      ctx.strokeStyle = "#ffe8a8";
      ctx.lineWidth = 1.4 * ss;
      ctx.beginPath();
      ctx.moveTo(headP.x, headP.y + 3 * ss);
      ctx.lineTo(sleeveLP.x, sleeveLP.y);
      ctx.moveTo(headP.x, headP.y + 3 * ss);
      ctx.lineTo(sleeveRP.x, sleeveRP.y);
      ctx.stroke();

      ctx.strokeStyle = "rgba(255, 235, 180, 0.9)";
      ctx.lineWidth = 2.2 * ss;
      ctx.beginPath();
      ctx.moveTo(bodyP.x - 2 * ss, bodyP.y + 2 * ss);
      ctx.quadraticCurveTo(rib1P.x, rib1P.y, rib2P.x, rib2P.y);
      ctx.stroke();
    }
  }
}

// ========== 绘制3D月球 ==========
function drawMoon() {
  const lightDir = { x: 0.5, y: -0.4, z: 0.77 };
  const lightLen = Math.sqrt(lightDir.x ** 2 + lightDir.y ** 2 + lightDir.z ** 2);
  lightDir.x /= lightLen;
  lightDir.y /= lightLen;
  lightDir.z /= lightLen;

  const visible = [];
  for (const p of moonParticles) {
    const phi = p.lon * Math.PI / 180;
    const theta = p.lat * Math.PI / 180;
    const wx = moonWorld.cx + moonWorld.radius * Math.cos(theta) * Math.sin(phi);
    const wy = moonWorld.cy + moonWorld.radius * Math.sin(theta);
    const wz = moonWorld.cz + moonWorld.radius * Math.cos(theta) * Math.cos(phi);

    const nx = (wx - moonWorld.cx) / moonWorld.radius;
    const ny = (wy - moonWorld.cy) / moonWorld.radius;
    const nz = (wz - moonWorld.cz) / moonWorld.radius;
    let diffuse = nx * lightDir.x + ny * lightDir.y + nz * lightDir.z;
    diffuse = Math.max(0, diffuse);

    const proj = project(wx, wy, wz);
    if (proj.z < -2) continue;
    visible.push({ x: proj.x, y: proj.y, z: proj.z, size: p.r * proj.scale, color: p.baseColor, light: diffuse });
  }
  visible.sort((a, b) => a.z - b.z);

  const centerProj = project(moonWorld.cx, moonWorld.cy, moonWorld.cz);
  const glowR = moonWorld.radius * centerProj.scale * 1.15;
  const glow = ctx.createRadialGradient(centerProj.x, centerProj.y, glowR * 0.6, centerProj.x, centerProj.y, glowR);
  glow.addColorStop(0, "rgba(255, 241, 200, 0)");
  glow.addColorStop(0.7, "rgba(255, 225, 160, 0.08)");
  glow.addColorStop(1, "rgba(255, 210, 130, 0)");
  ctx.fillStyle = glow;
  ctx.beginPath();
  ctx.arc(centerProj.x, centerProj.y, glowR, 0, Math.PI * 2);
  ctx.fill();

  ctx.save();
  ctx.beginPath();
  ctx.arc(centerProj.x, centerProj.y, moonWorld.radius * centerProj.scale, 0, Math.PI * 2);
  ctx.clip();

  for (const v of visible) {
    const brightness = 0.35 + v.light * 0.65;
    ctx.fillStyle = shadeColor(v.color, brightness);
    ctx.globalAlpha = 0.92;
    ctx.fillRect(v.x - v.size / 2, v.y - v.size / 2, v.size, v.size);
  }
  ctx.restore();
}

function shadeColor(hex, brightness) {
  const c = hex.replace("#", "");
  const r = parseInt(c.substring(0, 2), 16);
  const g = parseInt(c.substring(2, 4), 16);
  const b = parseInt(c.substring(4, 6), 16);
  const nr = Math.min(255, Math.floor(r * brightness));
  const ng = Math.min(255, Math.floor(g * brightness));
  const nb = Math.min(255, Math.floor(b * brightness));
  return `rgb(${nr}, ${ng}, ${nb})`;
}

// ========== 月球点击判定范围放大 ==========
function hitMoonScreen(px, py) {
  const cp = project(moonWorld.cx, moonWorld.cy, moonWorld.cz);
  const rScreen = moonWorld.radius * cp.scale;
  const dx = px - cp.x;
  const dy = py - cp.y;
  return Math.sqrt(dx * dx + dy * dy) < rScreen + 36;
}

// ========== PC点击事件 ==========
canvas.addEventListener("click", e => {
  if (hitMoonScreen(e.clientX, e.clientY)) {
    launchChangeE(e.clientX, e.clientY);
  } else {
    fireAtPoint(e.clientX, e.clientY);
  }
});

// ========== 移动端触摸事件【单指旋转 + 双指捏合缩放】 ==========
canvas.addEventListener("touchstart", e => {
  e.preventDefault();
  const touches = e.touches;
  if(touches.length === 1) {
    isDrag = false;
    touchMoved = false;
    const t = touches[0];
    touchStartX = t.clientX;
    touchStartY = t.clientY;
    lastX = t.clientX;
    lastY = t.clientY;
  } else if(touches.length === 2) {
    // 双指按下，记录初始两指距离
    touchMoved = true;
    const t1 = touches[0];
    const t2 = touches[1];
    startPinchDist = getTouchDistance(t1, t2);
  }
}, { passive: false });

canvas.addEventListener("touchmove", e => {
  e.preventDefault();
  const touches = e.touches;
  if(touches.length === 1) {
    // 单指：旋转
    const t = touches[0];
    const dx = t.clientX - touchStartX;
    const dy = t.clientY - touchStartY;
    const dist = Math.sqrt(dx*dx + dy*dy);
    if(dist > TAP_THRESHOLD) {
      touchMoved = true;
      isDrag = true;
      rotY -= dx * 0.005;
      rotX += dy * 0.005;
      touchStartX = t.clientX;
      touchStartY = t.clientY;
    }
  } else if(touches.length === 2) {
    // 双指捏合缩放逻辑
    touchMoved = true;
    const t1 = touches[0];
    const t2 = touches[1];
    const currentDist = getTouchDistance(t1, t2);
    const scaleRatio = currentDist / startPinchDist;
    scale = scale * scaleRatio;
    scale = Math.max(0.4, Math.min(2.2, scale));
    startPinchDist = currentDist;
  }
}, { passive: false });

canvas.addEventListener("touchend", e => {
  if(!touchMoved) {
    // 轻点，触发点击
    const tx = touchStartX;
    const ty = touchStartY;
    if (hitMoonScreen(tx, ty)) {
      launchChangeE(tx, ty);
    } else {
      fireAtPoint(tx, ty);
    }
  }
  isDrag = false;
  touchMoved = false;
}, { passive: false });

// 获取两点距离工具函数
function getTouchDistance(p1, p2) {
  const dx = p2.clientX - p1.clientX;
  const dy = p2.clientY - p1.clientY;
  return Math.sqrt(dx * dx + dy * dy);
}

function resize() {
  const dpr = isMobile ? Math.min(window.devicePixelRatio, 1.5) : (window.devicePixelRatio || 1);
  canvas.width = Math.floor(window.innerWidth * dpr);
  canvas.height = Math.floor(window.innerHeight * dpr);
  canvas.style.width = window.innerWidth + "px";
  canvas.style.height = window.innerHeight + "px";
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  initTextParticles();
  initBgParticles();
}

window.addEventListener("resize", resize);
window.addEventListener("orientationchange", () => setTimeout(resize, 120));

resetBtn.addEventListener("click", () => { rotX = 0; rotY = 0; scale = 1; });

canvas.addEventListener("mousedown", e => { isDrag = true; lastX = e.clientX; lastY = e.clientY; });
window.addEventListener("mousemove", e => {
  if (!isDrag) return;
  const dx = e.clientX - lastX;
  const dy = e.clientY - lastY;
  rotY -= dx * 0.005;
  rotX += dy * 0.005;
  lastX = e.clientX; lastY = e.clientY;
});
window.addEventListener("mouseup", () => { isDrag = false; });

canvas.addEventListener("wheel", e => {
  e.preventDefault();
  scale += e.deltaY * -0.0008;
  scale = Math.max(0.4, Math.min(2.2, scale));
}, { passive: false });

musicBtn.addEventListener("click", e => {
  e.stopPropagation();
  if (bgMusic.paused) {
    bgMusic.volume = 0.6;
    bgMusic.play().then(() => {
      musicOn = true;
      musicBtn.innerText = "音乐播放中 · 点击暂停";
    }).catch(err => {
      musicBtn.innerText = "音乐加载失败";
      console.error(err);
    });
  } else {
    bgMusic.pause();
    musicOn = false;
    musicBtn.innerText = "点击开启音乐";
  }
});

function fireAtPoint(px, py) {
  const worldPos = screenToWorld(px, py, 70);
  const count = isMobile ? 40 : 60;
  for (let i = 0; i < count; i++) {
    fireworkParticles.push(new FireworkParticle(worldPos.x, worldPos.y, worldPos.z));
  }
}

// ========== 背景星星 ==========
let bgParticles = [];
const BG_COUNT = isMobile ? 180 : 280;
function initBgParticles() {
  bgParticles.length = 0;
  for (let i = 0; i < BG_COUNT; i++) bgParticles.push(new BgParticle());
}
class BgParticle {
  constructor() { this.reset(); }
  reset() {
    this.x = (Math.random() - 0.5) * 900;
    this.y = (Math.random() - 0.5) * 700;
    this.z = (Math.random() - 0.5) * 500;
    this.r = Math.random() * 1.2 + 0.3;
    this.vx = (Math.random() - 0.5) * 0.22;
    this.vy = (Math.random() - 0.5) * 0.22;
    this.vz = (Math.random() - 0.5) * 0.12;
    this.a = Math.random() * 0.35 + 0.18;
    this.color = Math.random() > 0.5 ? "180, 210, 255" : "255, 248, 204";
  }
  update() {
    this.x += this.vx; this.y += this.vy; this.z += this.vz;
    if (Math.abs(this.x) > 450 || Math.abs(this.y) > 350 || Math.abs(this.z) > 280) this.reset();
    const p = project(this.x, this.y, this.z);
    if (p.z > -450) {
      ctx.beginPath();
      ctx.arc(p.x, p.y, this.r * p.scale, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(${this.color}, ${this.a * Math.min(1, p.scale)})`;
      ctx.fill();
    }
  }
}

// ========== 中间文字粒子 ==========
const texts = ["中秋安康", "花好月圆"];
let textIndex = 0;
let textChangeTimer = 0;
const textChangeInterval = 240;
let textParticles = [];

class TextParticle {
  constructor(tx, ty, tz) {
    this.x = (Math.random() - 0.5) * 800;
    this.y = (Math.random() - 0.5) * 600;
    this.z = (Math.random() - 0.5) * 400;
    this.targetX = tx; this.targetY = ty; this.targetZ = tz;
    this.size = Math.random() * 1.6 + 0.8;
    this.baseAlpha = 0.85;
    this.color = Math.random() > 0.4 ? "#ffe28a" : "#fff6c2";
    this.speed = 0.06 + Math.random() * 0.03;
    this.offsetAngle = Math.random() * Math.PI * 2;
    this.offsetSpeed = 0.008 + Math.random() * 0.01;
  }
  update() {
    this.x += (this.targetX - this.x) * this.speed;
    this.y += (this.targetY - this.y) * this.speed;
    this.z += (this.targetZ - this.z) * this.speed;
    this.offsetAngle += this.offsetSpeed;
    const breathX = Math.sin(this.offsetAngle) * 0.8;
    const breathY = Math.cos(this.offsetAngle * 0.6) * 0.6;
    const twinkle = 0.85 + Math.sin(this.offsetAngle * 1.8) * 0.15;
    const p = project(this.x + breathX, this.y + breathY, this.z);
    if (p.z > -450) {
      ctx.save();
      ctx.translate(p.x, p.y);
      const ds = this.size * p.scale;
      ctx.fillStyle = this.color;
      ctx.globalAlpha = this.baseAlpha * twinkle * Math.min(1, p.scale);
      ctx.fillRect(-ds / 2, -ds / 2, ds, ds);
      ctx.restore();
    }
    ctx.globalAlpha = 1;
  }
}

function getTextPoints(text) {
  const off = document.createElement("canvas");
  const octx = off.getContext("2d");
  const fontSize = Math.min(110, window.innerWidth / 5);
  octx.font = `600 ${fontSize}px "PingFang SC", "Microsoft YaHei", sans-serif`;
  octx.textAlign = "center"; octx.textBaseline = "middle";
  const w = Math.ceil(octx.measureText(text).width) + 120;
  const h = fontSize + 60;
  off.width = w; off.height = h;
  octx.font = `600 ${fontSize}px "PingFang SC", "Microsoft YaHei", sans-serif`;
  octx.textAlign = "center"; octx.textBaseline = "middle";
  octx.fillStyle = "#ffffff";
  octx.fillText(text, w / 2, h / 2);
  const imgData = octx.getImageData(0, 0, w, h);
  const data = imgData.data;
  const points = [];
  const gap = 3;
  for (let y = 0; y < h; y += gap) {
    for (let x = 0; x < w; x += gap) {
      const idx = (y * w + x) * 4;
      if (data[idx + 3] > 128) {
        points.push({ x: (x - w / 2) * 0.75, y: (y - h / 2) * 0.75, z: 0 });
      }
    }
  }
  return points;
}

function initTextParticles() {
  const pts = getTextPoints(texts[textIndex]);
  textParticles.length = 0;
  for (const p of pts) textParticles.push(new TextParticle(p.x, p.y, p.z));
}
function changeTextTarget() {
  const pts = getTextPoints(texts[textIndex]);
  for (let i = 0; i < textParticles.length; i++) {
    const p = pts[i % pts.length];
    textParticles[i].targetX = p.x;
    textParticles[i].targetY = p.y;
    textParticles[i].targetZ = p.z;
  }
}

// ========== 烟花 ==========
let fireworkParticles = [];
const MAX_FIREWORK = 120;
class FireworkParticle {
  constructor(x, y, z) {
    this.x = x; this.y = y; this.z = z;
    const ang = Math.random() * Math.PI * 2;
    const spd = Math.random() * 4 + 2;
    this.vx = Math.cos(ang) * spd;
    this.vy = Math.sin(ang) * spd;
    this.vz = (Math.random() - 0.5) * spd * 0.6;
    this.r = Math.random() * 2 + 1;
    this.alpha = 1;
    this.decay = 0.008 + Math.random() * 0.006;
    this.color = Math.random() > 0.5 ? "255,220,120" : "255,255,255";
  }
  update() {
    this.vy += 0.08;
    this.x += this.vx;
    this.y += this.vy;
    this.z += this.vz;
    this.alpha -= this.decay;
  }
  draw() {
    const p = project(this.x, this.y, this.z);
    if (p.z > -450 && this.alpha > 0) {
      ctx.beginPath();
      ctx.arc(p.x, p.y, this.r * p.scale, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(${this.color},${this.alpha * Math.min(1, p.scale)})`;
      ctx.fill();
    }
  }
}

// ========== 主循环 ==========
function animate() {
  ctx.fillStyle = "rgba(5,5,15,0.28)";
  ctx.fillRect(0, 0, window.innerWidth, window.innerHeight);

  for (const p of bgParticles) p.update();

  for (let i = fireworkParticles.length - 1; i >= 0; i--) {
    const fp = fireworkParticles[i];
    fp.update();
    fp.draw();
    if (fp.alpha <= 0) fireworkParticles.splice(i, 1);
  }

  for (const p of textParticles) p.update();

  updateChangeE();
  drawMoon();
  drawChangeE();

  textChangeTimer++;
  if (textChangeTimer >= textChangeInterval) {
    textChangeTimer = 0;
    textIndex = (textIndex + 1) % texts.length;
    changeTextTarget();
  }
  requestAnimationFrame(animate);
}

buildMoon();
resize();
animate();
</script>
